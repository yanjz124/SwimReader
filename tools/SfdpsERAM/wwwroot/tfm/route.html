<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM - Route Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tfm/route.css?v=2">
</head>
<body>

<header>
    <h1>TFM</h1>
    <span class="sub">ROUTE VIEWER</span>
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Callsign or flight ref...">
        <button id="searchBtn">SHOW</button>
    </div>
</header>

<div class="main">
    <div id="map"></div>
    <div class="sidebar" id="sidebar">
        <div class="empty-sidebar">
            <div>Enter a callsign to view route</div>
            <div style="color:#444; font-size:10px;">Route includes TFMS traversal data with<br>fix-by-fix lat/lon and sector crossings</div>
        </div>
    </div>
</div>

<script src="/idle-timer.js?v=2"></script>
<script src="/tfm/route.js?v=2"></script>
</body>
</html>
