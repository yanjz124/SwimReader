<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Aircraft Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🛩️</text></svg>">
<style>
  :root { --yel:#cccc44; --dim:#8a8a3a; --bg:#0a0a0a; --card:#141414; --line:#333;
    --accent:#4aa3ff; --ok:#44cc44; --warn:#ff8c00; --white:#eee; --head:#101010; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--yel);
    font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace; font-size:14px; }
  body { padding-bottom:40px; }
  a { color:var(--accent); text-decoration:none; }
  .wrap { max-width:1100px; margin:0 auto; }

  header { position:sticky; top:0; z-index:10; background:#000; border-bottom:1px solid var(--line);
    padding:9px 12px; display:flex; gap:8px; align-items:center; }
  header .home { color:var(--dim); font-size:15px; padding:6px; }
  header form { flex:1; display:flex; gap:8px; }
  header input { flex:1; min-width:0; background:#1a1a1a; color:var(--yel); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; font:inherit; text-transform:uppercase; letter-spacing:1px; }
  header input::placeholder { color:#666; text-transform:none; letter-spacing:0; }
  header button { background:#1e2e1e; color:#bfe6bf; border:1px solid #3a5a3a; border-radius:8px;
    padding:0 14px; font:inherit; font-weight:bold; cursor:pointer; }

  /* toolbar: count + pagination */
  .bar { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 14px; color:var(--dim); font-size:12px; flex-wrap:wrap; }
  .bar .pg { display:flex; align-items:center; gap:6px; }
  .bar button { background:#181818; color:var(--yel); border:1px solid var(--line); border-radius:6px;
    padding:5px 11px; font:inherit; cursor:pointer; }
  .bar button:disabled { opacity:.35; cursor:default; }

  /* table */
  .tablewrap { overflow-x:auto; padding:0 8px; }
  table { border-collapse:collapse; width:100%; min-width:720px; font-size:13.5px; }
  thead th { position:sticky; top:53px; background:var(--head); color:var(--dim); text-align:left;
    font-weight:normal; letter-spacing:.5px; padding:9px 10px; border-bottom:1px solid var(--line);
    cursor:pointer; white-space:nowrap; user-select:none; }
  thead th:hover { color:var(--yel); }
  thead th .ar { color:var(--yel); margin-left:3px; }
  thead th.num, td.num { text-align:right; }
  tbody td { padding:8px 10px; border-bottom:1px solid #1e1e1e; white-space:nowrap; }
  tbody tr { cursor:pointer; }
  tbody tr:hover td { background:#181808; }
  td.reg { color:#fff; font-weight:bold; letter-spacing:.5px; }
  td.hex { color:#8fb0d8; }
  td.selcal { color:#39ff62; letter-spacing:1px; }
  td.op, td.type, td.wake { color:var(--yel); }
  td.dim { color:var(--dim); }
  .msg { padding:34px 20px; text-align:center; color:var(--dim); line-height:1.6; }
  .msg b { color:var(--yel); }

  /* detail */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 12px; overflow:hidden; }
  .card > h2 { margin:0; padding:12px 14px; background:#0d0d0d; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card > h2 .reg { font-size:26px; font-weight:bold; color:#fff; letter-spacing:2px; }
  .card > h2 .type { font-size:15px; color:var(--yel); }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; padding:12px 14px; font-size:14px; }
  .grid .k { color:var(--dim); white-space:nowrap; }
  .grid .v { color:var(--yel); word-break:break-word; }
  .grid .v.hl { color:#fff; }
  .grid .v.hex { color:#8fb0d8; letter-spacing:1px; }
  .grid .v.selcal { color:#39ff62; letter-spacing:2px; font-weight:bold; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:6px; border:1px solid var(--line); color:var(--yel); background:#111; }
  .chip a { color:var(--yel); }
  .back { display:inline-block; margin:12px 14px 0; color:var(--dim); cursor:pointer; }
  .disc { padding:14px; color:var(--dim); font-size:11px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="/" title="Home">&larr;</a>
    <form id="f"><input id="q" placeholder="Filter — registration, ICAO24, SELCAL, callsign, operator, type…"
      autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit">FILTER</button></form>
  </header>
  <div id="view"></div>
  <div class="disc">Built from aircraft observed on the FAA SWIM feed in US airspace — not a complete registry.
    Blocked (LADD) aircraft are hidden. NOT FOR OPERATIONAL USE.</div>
</div>
<script>
const view = document.getElementById('view');
const qEl = document.getElementById('q');
const PAGE = 100;

const COLS = [
  { key:'registration', label:'REG',      cls:'reg' },
  { key:'type',         label:'TYPE',     cls:'type' },
  { key:'operator',     label:'OPERATOR', cls:'op' },
  { key:'icao24',       label:'ICAO24',   cls:'hex' },
  { key:'selcal',       label:'SELCAL',   cls:'selcal' },
  { key:'wake',         label:'WAKE',     cls:'wake' },
  { key:'sightings',    label:'SEEN',     cls:'num dim', num:true },
  { key:'lastSeen',     label:'LAST SEEN',cls:'dim' },
];

// table state (reflected in the URL query string)
let state = { q:'', sort:'lastSeen', dir:'desc', offset:0, total:0 };

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso).getTime())/1000;
  if (d < 90) return 'just now';
  if (d < 5400) return Math.round(d/60)+' min ago';
  if (d < 129600) return Math.round(d/3600)+' h ago';
  return Math.round(d/86400)+' d ago';
}

function stateToUrl(replace){
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'lastSeen') p.set('sort', state.sort);
  if (state.dir !== 'desc') p.set('dir', state.dir);
  if (state.offset) p.set('offset', state.offset);
  const url = '/aircraft' + (p.toString() ? '?'+p.toString() : '');
  if (replace) history.replaceState({table:true}, '', url); else history.pushState({table:true}, '', url);
}

async function loadTable(push){
  stateToUrl(!push);
  view.innerHTML = '<div class="msg">Loading…</div>';
  try {
    const p = new URLSearchParams({ sort:state.sort, dir:state.dir, offset:state.offset, limit:PAGE });
    if (state.q) p.set('q', state.q);
    const r = await fetch('/api/aircraft/list?'+p.toString());
    const j = await r.json();
    state.total = j.total;
    view.innerHTML = tableHtml(j);
    wireTable();
  } catch (e) { view.innerHTML = '<div class="msg">Load failed. Try again.</div>'; }
}

function tableHtml(j){
  const from = j.total ? j.offset+1 : 0;
  const to = Math.min(j.offset + j.limit, j.total);
  const hasPrev = j.offset > 0;
  const hasNext = to < j.total;
  const label = state.q
    ? (j.total.toLocaleString()+' match'+(j.total===1?'':'es')+' for “'+esc(state.q)+'”')
    : (j.total.toLocaleString()+' aircraft');
  const bar =
    '<div class="bar"><div>'+label+(j.total? ' · showing '+from+'–'+to : '')+'</div>'
    + '<div class="pg">'
      + '<button id="prev"'+(hasPrev?'':' disabled')+'>&larr; Prev</button>'
      + '<button id="next"'+(hasNext?'':' disabled')+'>Next &rarr;</button>'
    + '</div></div>';
  if (!j.results.length)
    return bar + '<div class="msg">No aircraft'+(state.q?' match <b>'+esc(state.q)+'</b>':'')+'.</div>';
  const head = '<thead><tr>' + COLS.map(c => {
    const active = state.sort === c.key;
    const ar = active ? '<span class="ar">'+(state.dir==='asc'?'▲':'▼')+'</span>' : '';
    return '<th data-key="'+c.key+'"'+(c.num?' class="num"':'')+'>'+c.label+ar+'</th>';
  }).join('') + '</tr></thead>';
  const rows = j.results.map(a => {
    const id = a.icao24 || a.registration || '';
    return '<tr data-id="'+esc(id)+'">' + COLS.map(c => {
      let v = a[c.key];
      if (c.key === 'lastSeen') v = ago(v);
      else if (c.key === 'sightings') v = (v||0).toLocaleString();
      else v = v || '';
      return '<td class="'+c.cls+'">'+esc(v)+'</td>';
    }).join('') + '</tr>';
  }).join('');
  return bar + '<div class="tablewrap"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
}

function wireTable(){
  view.querySelectorAll('thead th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (state.sort === k) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort = k; state.dir = (k==='sightings'||k==='lastSeen'||k==='firstSeen') ? 'desc' : 'asc'; }
    state.offset = 0;
    loadTable(true);
  }));
  view.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => detail(tr.dataset.id)));
  const prev = view.querySelector('#prev'), next = view.querySelector('#next');
  if (prev) prev.addEventListener('click', () => { state.offset = Math.max(0, state.offset - PAGE); loadTable(true); });
  if (next) next.addEventListener('click', () => { state.offset += PAGE; loadTable(true); });
}

async function detail(id, push) {
  if (push !== false) history.pushState({id}, '', '/aircraft/'+encodeURIComponent(id));
  view.innerHTML = '<div class="msg">Loading…</div>';
  try {
    const r = await fetch('/api/aircraft/'+encodeURIComponent(id));
    if (!r.ok) { view.innerHTML = '<div class="msg">Aircraft not found.</div>'; return; }
    const a = await r.json();
    view.innerHTML = detailHtml(a);
    const b = view.querySelector('.back'); if (b) b.addEventListener('click', () => history.back());
  } catch { view.innerHTML = '<div class="msg">Load failed.</div>'; }
}

function kv(k,v,cls){ return v ? '<div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div>' : ''; }

function detailHtml(a) {
  const cs = (a.callsigns||[]).map(c =>
    '<span class="chip"><a href="/track/'+encodeURIComponent(c)+'">'+esc(c)+'</a></span>').join('');
  const rt = (a.routes||[]).map(x => '<span class="chip">'+esc(x)+'</span>').join('');
  return '<div class="back">&larr; back to table</div>'
    + '<div class="card"><h2>'
      + '<span class="reg">'+esc(a.registration||a.icao24||'?')+'</span>'
      + '<span class="type">'+esc(a.type||'')+'</span></h2>'
    + '<div class="grid">'
      + kv('ICAO 24', esc(a.icao24), 'hex')
      + kv('Registration', esc(a.registration), 'hl')
      + kv('SELCAL', esc(a.selcal), 'selcal')
      + kv('Type', esc(a.type))
      + kv('Operator', esc(a['operator']), 'hl')
      + kv('Wake', esc(a.wake))
      + kv('Equipment', esc(a.equipment))
      + kv('Times seen', esc((a.sightings||0).toLocaleString()))
      + kv('First seen', a.firstSeen ? esc(new Date(a.firstSeen).toLocaleString())+' UTC' : '')
      + kv('Last seen', a.lastSeen ? esc(new Date(a.lastSeen).toLocaleString())+' ('+esc(ago(a.lastSeen))+')' : '')
    + '</div>'
    + (cs ? '<div class="grid"><div class="k">Callsigns</div><div class="v"><div class="chips">'+cs+'</div></div></div>' : '')
    + (rt ? '<div class="grid"><div class="k">Routes</div><div class="v"><div class="chips">'+rt+'</div></div></div>' : '')
    + '</div>';
}

// Routing: /aircraft/{id} → detail; /aircraft?q=&sort=&dir=&offset= → table.
function route() {
  const m = location.pathname.match(/^\/aircraft\/([^/]+)$/);
  if (m) { detail(decodeURIComponent(m[1]), false); return; }
  const p = new URLSearchParams(location.search);
  state.q = (p.get('q') || '').trim();
  state.sort = p.get('sort') || 'lastSeen';
  state.dir = p.get('dir') || 'desc';
  state.offset = Math.max(0, parseInt(p.get('offset')||'0', 10) || 0);
  qEl.value = state.q;
  loadTable(false /* replaceState, don't push on plain nav */);
}
window.addEventListener('popstate', route);
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault(); state.q = qEl.value.trim(); state.offset = 0; loadTable(true);
});

route();
</script>
<script src="/shared/disclaimer.js?v=3"></script>
</body>
</html>
