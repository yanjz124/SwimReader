<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASDE-X</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/shared/common.css?v=28">
<link rel="stylesheet" href="/asdex/scope.css?v=28">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<div id="map"></div>
<div id="crosshair"><div class="ch h"></div><div class="ch v"></div></div>
<div id="gatecode-popup">
    <h3>SCRATCHPAD CONFIG — <span id="gc-airport"></span></h3>
    <div style="color:#ff8c00;font-size:10px;margin-bottom:6px">Changes apply to all users viewing this airport.</div>
    <table><thead><tr><th>FIX</th><th>CODE</th><th></th></tr></thead><tbody id="gc-body"></tbody></table>
    <div style="margin-top:8px">
        <button class="gc-btn" id="gc-add">+ ADD</button>
        <button class="gc-btn" id="gc-save">SAVE</button>
        <button class="gc-btn" id="gc-close">CLOSE</button>
    </div>
    <details style="margin-top:10px;border-top:1px solid #333;padding-top:8px">
        <summary style="color:#888;cursor:pointer;font-size:10px">PASTE IMPORT</summary>
        <textarea id="gc-import-area" rows="4" style="width:100%;background:#111;border:1px solid #444;color:#ccc;font-family:inherit;font-size:10px;margin-top:4px;padding:4px;resize:vertical" placeholder="Paste tab/comma-separated lines: PATTERN  CODE"></textarea>
        <button class="gc-btn" id="gc-import-btn">IMPORT</button>
    </details>
    <details id="vnas-rules-section" style="margin-top:10px;border-top:1px solid #333;padding-top:8px;display:none">
        <summary style="color:#888;cursor:pointer;font-size:10px">vNAS AUTO RULES <span id="vnas-count" style="color:#666"></span></summary>
        <div id="vnas-rules-body" style="margin-top:4px;color:#666;font-size:10px;max-height:200px;overflow-y:auto"></div>
    </details>
</div>
<div id="flight-list">
    <div id="fl-header">
        <span style="color:#cccc44">FLIGHT LIST</span>
        <span id="fl-count" style="color:#888"></span>
    </div>
    <div id="fl-body">
        <table id="fl-table">
            <tbody id="fl-tbody"></tbody>
        </table>
    </div>
</div>
<div id="statusbar">
    <a href="/asdex">◂ DIR</a>
    <span class="airport-id" id="airport-id">—</span>
    <span id="track-count">0 tracks</span>
    <span id="conn">CONNECTING</span>
    <span style="flex:1"></span>
    <label>FONT</label>
    <input type="number" id="font-size" min="8" max="20" value="15" step="1">
    <label>ROT</label>
    <input type="number" id="rot" min="0" max="360" value="360" step="1">
    <span style="border-left:1px solid #444;height:14px"></span>
    <button class="db-tog" data-field="alt">ALT</button>
    <button class="db-tog" data-field="type">TYPE</button>
    <button class="db-tog" data-field="sens">SENS</button>
    <button class="db-tog" data-field="cat">CAT</button>
    <button class="db-tog" data-field="fix">FIX</button>
    <button class="db-tog" data-field="vel">VEL</button>
    <span style="border-left:1px solid #444;height:14px"></span>
    <button id="unk-toggle">UNKNOWNS</button>
    <button id="fl-toggle">FLT LIST</button>
    <button id="gc-toggle">SP CONFIG</button>
    <button id="dn-toggle">NIGHT</button>
    <button id="hb-toggle">HOLDBARS</button>
    <button id="fs-toggle">FULL</button>
    <button id="replay-btn">REPLAY</button>
</div>
<div id="replay-panel" style="display:none;position:fixed;bottom:30px;left:0;right:0;background:#111;border-top:1px solid #333;padding:6px 12px;z-index:9000;font-family:'Consolas',monospace;font-size:11px;display:none;">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <input type="datetime-local" id="rp-start" step="1"
            style="background:#1a1a1a;color:#00cc00;border:1px solid #333;padding:2px 4px;font-family:inherit;font-size:10px;">
        <button id="rp-go" style="background:#006800;color:#fff;border:1px solid #333;padding:2px 8px;font-family:inherit;font-size:10px;cursor:pointer;">GO</button>
        <span id="rp-controls" style="display:none;">
            <button id="rp-pause" style="background:#333;color:#fff;border:1px solid #555;padding:1px 6px;font-family:inherit;font-size:10px;cursor:pointer;">&#9208;</button>
            <select id="rp-speed" style="background:#1a1a1a;color:#00cc00;border:1px solid #333;font-family:inherit;font-size:10px;">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="8">8x</option>
                <option value="16">16x</option>
                <option value="60">60x</option>
            </select>
            <span id="rp-time" style="color:#00cc00;font-size:10px;"></span>
            <span id="rp-status" style="color:#888;font-size:10px;"></span>
            <button id="rp-stop" style="background:#880000;color:#fff;border:1px solid #333;padding:1px 8px;font-family:inherit;font-size:10px;cursor:pointer;">LIVE</button>
        </span>
        <span id="rp-range" style="color:#555;font-size:9px;"></span>
    </div>
</div>
<div id="ldr-dir-overlay" style="display:none;">
    <div>LDR DIR</div>
    <div id="ldr-dir-value"></div>
</div>
<div id="cmd-overlay" style="display:none;"></div>
<div id="fp-popup" style="display:none;">
    <div id="fp-titlebar">
        <span id="fp-title"></span>
        <span id="fp-close">✕</span>
    </div>
    <div id="fp-fields"></div>
    <div id="fp-rte"></div>
</div>
<div id="zulu-clock"></div>
<div id="holdbar-panel" style="display:none">
    <div id="hb-header">
        <span style="color:#ff8c00">SAFETY LOGIC HOLD BARS</span>
        <span id="hb-status" style="color:#888"></span>
    </div>
    <div id="hb-body">
        <div id="hb-bits"></div>
        <div id="hb-raw" style="color:#666;font-size:9px;margin-top:6px;word-break:break-all"></div>
    </div>
</div>

<script src="/asdex/scope.js?v=28"></script>
<script src="/idle-timer.js?v=28"></script>
</body>
</html>
