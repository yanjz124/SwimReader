<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ERAM — Facility &amp; Sector Picker</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #cccc44;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .subhead { padding: 6px 20px 8px; border-bottom: 1px solid #3a3a14; }
  .subhead .sub { color: #b8b884; font-size: 11px; }
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    flex: 1; min-height: 0;
  }
  .col { overflow-y: auto; border-right: 1px solid #3a3a14; }
  .col:last-child { border-right: none; }
  .col h2 {
    margin: 0;
    padding: 8px 16px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #b8b884;
    border-bottom: 1px solid #3a3a14;
    background: #050505;
    position: sticky;
    top: 0;
  }
  .row {
    padding: 6px 16px;
    border-bottom: 1px solid #1a1a08;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row:hover { background: #1a1a05; }
  .row.active { background: #3a3a0a; color: #fff; }
  .row .id { color: #cccc44; font-weight: bold; }
  .row .meta { color: #888835; font-size: 11px; }
  .row .meta .live { color: #cccc44; }
  .placeholder { padding: 16px; color: #888835; }
  .empty { color: #666; font-style: italic; padding: 16px; }

  .sectors-pane { padding: 12px 16px; }
  .sectors-pane .hint { color: #888835; font-size: 11px; margin-bottom: 10px; }
  .sec-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px;
    border: 1px solid #2a2a08;
    background: #0c0c00;
    cursor: pointer;
    font-size: 12px;
  }
  .sec-row:hover { background: #1c1c00; }
  .sec-row.on { background: #3a3a0a; color: #fff; border-color: #6a6a14; }
  .sec-row .sid { font-weight: bold; }
  .sec-row .scnt { color: #888835; font-size: 10px; }
  .sec-row.on .scnt { color: #cccc88; }
  .sec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px;
  }
  .sec-actions { margin-bottom: 8px; display: flex; gap: 8px; }
  .sec-actions button {
    background: #1a1a05; color: #cccc44; border: 1px solid #3a3a14;
    padding: 4px 10px; font-family: inherit; font-size: 11px; cursor: pointer;
  }
  .sec-actions button:hover { background: #2a2a08; }

  .launch-bar {
    position: fixed; bottom: 0; right: 0;
    padding: 12px 20px;
    background: rgba(0,0,0,0.95);
    border-top: 1px solid #3a3a14;
    border-left: 1px solid #3a3a14;
    display: flex; gap: 10px; align-items: center;
  }
  .launch-bar .summary { color: #cccc44; font-size: 12px; margin-right: 12px; }
  .btn {
    background: #1a1a05; color: #cccc44; border: 1px solid #3a3a14;
    padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer;
    letter-spacing: 1px;
  }
  .btn:hover { background: #3a3a0a; color: #fff; }
  .btn.primary { background: #3a3a0a; color: #fff; border-color: #6a6a14; }
  .btn.primary:hover { background: #5a5a14; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary:disabled:hover { background: #3a3a0a; color: #fff; }
</style>
<link rel="stylesheet" href="/shared/common.css">
<link rel="stylesheet" href="/shared/frame.css?v=3">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header>
  <h1>ERAM</h1>
</header>
<div class="subhead">
  <div class="sub">Pick an ARTCC, then pick the sector(s) you're working. Live track counts refresh every 5s from <code>/api/sectors</code>. Click <b>LAUNCH</b> to open the scope, or <b>RESUME</b> to restore your last session unchanged.</div>
</div>
<div class="layout">
  <div class="col">
    <h2>ARTCC</h2>
    <div id="facilities"><div class="placeholder">Loading…</div></div>
  </div>
  <div class="col sectors-pane">
    <h2 style="margin:-12px -16px 12px; padding:8px 16px;">SECTORS</h2>
    <div id="sectors-empty" class="empty">Select an ARTCC to see its active sectors.</div>
    <div id="sectors-content" style="display:none;">
      <div class="hint" id="sec-hint"></div>
      <div class="sec-actions">
        <button id="btn-all">ALL</button>
        <button id="btn-none">NONE</button>
        <button id="btn-handoff">ONLY ACTIVE</button>
      </div>
      <div class="sec-grid" id="sec-grid"></div>
    </div>
  </div>
</div>

<div class="launch-bar">
  <span class="summary" id="summary">No selection</span>
  <button class="btn" id="btn-resume" title="Open ERAM with whatever facility + sectors you had selected last time">RESUME LAST SESSION</button>
  <button class="btn primary" id="btn-launch" disabled>LAUNCH ▸</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
// Must match SETTINGS_VERSION in eram.js or the scope discards what we
// write as outdated.
const SETTINGS_VERSION = 3;
const STORAGE_KEY = 'eram-settings';

let selectedFacility = null;
let selectedSectors = new Set();
let allFacilities = [];
let facilityById = new Map();

function readSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.settingsVersion || s.settingsVersion < SETTINGS_VERSION) return null;
    return s;
  } catch { return null; }
}

function writeLaunchSettings(fac, sectors) {
  // Merge with existing saved settings so we don't wipe sliders/colors/etc.
  // If nothing's saved, seed minimal payload with settingsVersion so the
  // scope's outdated-version check (eram.js:4881) doesn't immediately
  // discard our facility+sectors.
  let s = {};
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) s = JSON.parse(raw) || {};
  } catch {}
  s.settingsVersion = SETTINGS_VERSION;
  s.facility = fac;
  s.sectors = [...sectors];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function updateSummary() {
  const sumEl = $("summary"); const launchBtn = $("btn-launch");
  if (!selectedFacility) {
    sumEl.textContent = "No selection";
    launchBtn.disabled = true; return;
  }
  const n = selectedSectors.size;
  sumEl.innerHTML = `<b>${selectedFacility}</b> · ${n} sector${n === 1 ? "" : "s"}` +
    (n ? ` <span style="color:#888835">(${[...selectedSectors].sort().join(" ")})</span>` : "");
  launchBtn.disabled = false;
}

function pickFacility(fac) {
  selectedFacility = fac.facility;
  selectedSectors = new Set();
  for (const el of document.querySelectorAll("#facilities .row"))
    el.classList.toggle("active", el.dataset.id === fac.facility);
  renderSectors(fac);
  updateSummary();
}

function renderSectors(fac) {
  $("sectors-empty").style.display = "none";
  $("sectors-content").style.display = "block";
  $("sec-hint").textContent = `${fac.facility} · ${fac.sectorCount} sector${fac.sectorCount === 1 ? "" : "s"} · ${fac.totalTracks} active tracks. Click sectors you're working. (None selected = facility-wide view, no Quick Look.)`;
  const sorted = [...fac.sectors].sort((a, b) => a.id.localeCompare(b.id));
  $("sec-grid").innerHTML = sorted.map(s => {
    const handoffs = (s.handoffsIn || 0) + (s.handoffsOut || 0);
    const ho = handoffs > 0 ? ` · ${handoffs}H` : "";
    const active = (s.tracks > 0) || (handoffs > 0);
    return `<div class="sec-row" data-sec="${s.id}" data-active="${active ? 1 : 0}">
      <span class="sid">${s.id}</span>
      <span class="scnt">${s.tracks}T${ho}</span>
    </div>`;
  }).join("");
  for (const el of document.querySelectorAll(".sec-row")) {
    el.onclick = () => {
      const sid = el.dataset.sec;
      if (selectedSectors.has(sid)) { selectedSectors.delete(sid); el.classList.remove("on"); }
      else                          { selectedSectors.add(sid); el.classList.add("on"); }
      updateSummary();
    };
  }
}

async function loadFacilities() {
  try {
    const data = await fetch("/api/sectors?rangeMin=60").then(r => r.json());
    // ERAM is en-route only — filter to Z-prefixed ARTCC facilities.
    allFacilities = (data.facilities || [])
      .filter(f => (f.facility || "").startsWith("Z"))
      .sort((a, b) => a.facility.localeCompare(b.facility));
    facilityById.clear();
    for (const f of allFacilities) facilityById.set(f.facility, f);
    $("facilities").innerHTML = allFacilities.map(f =>
      `<div class="row" data-id="${f.facility}">
        <span class="id">${f.facility}</span>
        <span class="meta"><span class="live">${f.totalTracks}T</span> · ${f.sectorCount} sec</span>
      </div>`).join("");
    for (const el of document.querySelectorAll("#facilities .row"))
      el.onclick = () => pickFacility(facilityById.get(el.dataset.id));

    // Re-render the sector grid for the live counts if a facility is picked.
    if (selectedFacility && facilityById.has(selectedFacility)) {
      const keep = new Set(selectedSectors);
      renderSectors(facilityById.get(selectedFacility));
      for (const sid of keep) {
        const el = document.querySelector(`.sec-row[data-sec="${CSS.escape(sid)}"]`);
        if (el) { el.classList.add("on"); selectedSectors.add(sid); }
      }
      updateSummary();
    }
  } catch (e) {
    $("facilities").innerHTML = `<div class="placeholder">Error: ${e}</div>`;
  }
}

// ── Buttons ────────────────────────────────────────────────────────────────
$("btn-launch").onclick = () => {
  if (!selectedFacility) return;
  writeLaunchSettings(selectedFacility, selectedSectors);
  location.href = "/eram/scope";
};

$("btn-resume").onclick = () => {
  // No write needed — existing localStorage drives the scope. If there's no
  // saved session at all, fall through to the scope with defaults (button is
  // disabled in that case below, but defense in depth).
  location.href = "/eram/scope";
};

$("btn-all").onclick = () => {
  if (!selectedFacility) return;
  for (const el of document.querySelectorAll(".sec-row")) {
    el.classList.add("on"); selectedSectors.add(el.dataset.sec);
  }
  updateSummary();
};
$("btn-none").onclick = () => {
  selectedSectors.clear();
  for (const el of document.querySelectorAll(".sec-row")) el.classList.remove("on");
  updateSummary();
};
$("btn-handoff").onclick = () => {
  // Pre-select sectors that have live tracks or handoffs in the past 60 min.
  selectedSectors.clear();
  for (const el of document.querySelectorAll(".sec-row")) {
    if (el.dataset.active === "1") { el.classList.add("on"); selectedSectors.add(el.dataset.sec); }
    else                            el.classList.remove("on");
  }
  updateSummary();
};

// Label the resume button with the saved facility/sector count so users see
// what they'll get before clicking. Disable when nothing's saved.
const saved = readSaved();
if (saved && saved.facility) {
  $("btn-resume").innerHTML = `RESUME ▸ <b>${saved.facility}</b>` +
    (saved.sectors && saved.sectors.length ? ` <span style="color:#888835">(${saved.sectors.length})</span>` : "");
} else {
  $("btn-resume").disabled = true;
  $("btn-resume").title = "No saved session yet — launch with a selection first.";
}

loadFacilities();
setInterval(loadFacilities, 5000);
</script>
<script src="/shared/frame.js?v=2"></script>
</body>
</html>
