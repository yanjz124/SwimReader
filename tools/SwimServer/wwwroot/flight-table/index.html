<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFDPS - Flight Table</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📄</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=3">
<link rel="stylesheet" href="/flight-table/flight-table.css?v=7">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<div class="topbar" style="padding-left:100px">
    <h1>FLIGHT TABLE</h1>
    <span class="status" id="status">connecting...</span>
    <div class="stats" id="stats"></div>
</div>

<div class="filterbar">
    <select class="filter-select" id="searchField" title="Field to search. 'All' searches callsign, type, airport, route, remarks, squawk, registration, CID.">
        <option value="all">All</option>
        <option value="callsign">Callsign</option>
        <option value="aircraftType">Type</option>
        <option value="airport">Airport (orig/dest)</option>
        <option value="origin">Origin</option>
        <option value="destination">Destination</option>
        <option value="route">Route</option>
        <option value="remarks">Remarks</option>
        <option value="squawk">Squawk</option>
        <option value="registration">Registration</option>
        <option value="computerId">CID</option>
        <option value="controllingSector">Sector</option>
        <option value="tmiIds">TMI</option>
    </select>
    <input type="text" class="search-box" id="search" placeholder="Search… (wildcards: foo*, *foo*, multi-word AND)" title="Picks the field from the dropdown. You can also type field:value (cs:NKS9*, dest:KORD), with * wildcards, multiple terms AND'd together. e.g. dest:KORD type:A320">
    <div class="filter-sep"></div>
    <span class="filter-label">STATUS</span>
    <select class="filter-select" id="filterStatus">
        <option value="active">Active</option>
        <option value="dropped">Dropped</option>
        <option value="historical">Historical</option>
    </select>
    <span class="filter-label">FACILITY</span>
    <select class="filter-select" id="filterFacility">
        <option value="">All</option>
    </select>
    <span class="filter-label">SECTOR</span>
    <select class="filter-select" id="filterSector" title="Sector list narrows to whatever facility you have selected">
        <option value="">All</option>
    </select>
    <span class="filter-label">RULES</span>
    <select class="filter-select" id="filterRules">
        <option value="">All</option>
        <option value="IFR">IFR</option>
        <option value="VFR">VFR</option>
    </select>
    <div class="filter-sep"></div>
    <span class="result-count" id="resultCount"></span>
    <button class="export-btn" id="exportCsv" title="Download all visible (filtered) flights as a CSV file">EXPORT CSV</button>
</div>

<div class="main">
    <div class="flight-list" id="flightList">
        <div class="col-header" id="colHeader">
            <span class="pin-col" title="Pin to protect from history cleanup">★</span>
            <span data-col="callsign" class="sorted">CALLSIGN</span>
            <span data-col="aircraftType">TYPE</span>
            <span data-col="origin">DEP</span>
            <span data-col="destination">ARR</span>
            <span data-col="assignedAltitude">ALT</span>
            <span data-col="interimAltitude">INT</span>
            <span data-col="flightRules">FR</span>
            <span data-col="controllingFacility">SECTOR</span>
            <span data-col="squawk">SQK</span>
            <span data-col="dataLinkCode">DL</span>
            <span>ST</span>
        </div>
        <div id="rows"></div>
    </div>

    <div class="detail-panel collapsed" id="detailPanel">
        <div class="detail-header">
            <span class="cs-big" id="detailCallsign"></span>
            <span class="type-badge" id="detailType"></span>
            <span class="status-badge" id="detailStatus"></span>
            <span class="detail-close" id="detailClose">&times;</span>
        </div>
        <div class="tab-bar">
            <div class="tab active" data-tab="plan">FLIGHT PLAN</div>
            <div class="tab" data-tab="events">EVENTS<span class="event-count" id="eventCount"></span></div>
        </div>
        <div class="detail-body" id="detailBody">
        </div>
    </div>
</div>

<script src="/flight-table/flight-table.js?v=10"></script>
<script src="/idle-timer.js?v=4"></script>
<script src="/shared/frame.js?v=3"></script>
<script src="/shared/disclaimer.js?v=1"></script>
</body>
</html>
