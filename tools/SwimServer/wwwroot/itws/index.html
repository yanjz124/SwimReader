<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ITWS — Integrated Terminal Weather System</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #d4d4aa;
    --dim: #888;
    --accent: #cccc44;
    --good: #6f6;
    --warn: #ff8c00;
    --emerg: #ff4444;
    --cyan:  #6cf;

    --nws1: #00b050;
    --nws2: #00ff00;
    --nws3: #ffff00;
    --nws4: #ff8000;
    --nws5: #ff0000;
    --nws6: #ff00ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: #111;
  }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 1px; }
  header .stats { color: var(--dim); font-size: 12px; }
  header .stats .v { color: var(--text); }
  header .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  header .conn { padding: 2px 8px; border: 1px solid var(--border); border-radius: 2px; font-size: 11px; }
  header .conn.ok  { color: var(--good); border-color: #353; }
  header .conn.bad { color: var(--emerg); border-color: #533; }
  header .api { color: var(--dim); text-decoration: none; font-size: 11px; }
  header .api:hover { color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    height: calc(100vh - 46px);
  }
  #airports { overflow-y: auto; border-right: 1px solid var(--border); }
  #airports h2 {
    margin: 0; padding: 8px 12px;
    font-size: 11px; letter-spacing: 1px;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0;
  }
  .ap-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px;
    border-bottom: 1px solid #1a1a1a;
    cursor: pointer;
  }
  .ap-row:hover { background: #1c1c0c; }
  .ap-row.active { background: #2a2a08; color: var(--accent); }
  .ap-row .n { font-weight: bold; }
  .ap-row .c { color: var(--dim); font-size: 11px; }

  #dash { overflow-y: auto; padding: 16px; }
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 70vh; color: var(--dim); gap: 8px;
  }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 3px;
    min-height: 120px;
  }
  .card h3 {
    margin: 0 0 10px 0;
    font-size: 11px; letter-spacing: 1px;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  .card .ago { color: var(--dim); font-weight: normal; font-size: 10px; }
  .card.span3 { grid-column: span 3; }
  .card.span4 { grid-column: span 4; }
  .card.span5 { grid-column: span 5; }
  .card.span6 { grid-column: span 6; }
  .card.span7 { grid-column: span 7; }
  .card.span8 { grid-column: span 8; }
  .card.span12 { grid-column: span 12; }

  /* ── Wind card ───────── */
  .wind { display: flex; align-items: center; gap: 18px; justify-content: center; padding: 6px 0; }
  .wind .compass {
    width: 130px; height: 130px;
    border: 2px solid var(--border);
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background:
      radial-gradient(circle at center, transparent 0 60%, rgba(204,204,68,0.05) 70%);
  }
  .wind .compass .tick {
    position: absolute; left: 50%; top: 0;
    width: 1px; height: 8px;
    background: var(--dim);
    transform-origin: 50% 65px;
  }
  .wind .compass .tick.cardinal { background: var(--text); height: 14px; }
  .wind .compass .lbl {
    position: absolute; font-size: 10px; color: var(--dim);
    transform: translate(-50%, -50%);
  }
  .wind .compass .needle {
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 50px solid var(--accent);
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%);
    transition: transform 0.6s ease;
  }
  .wind .compass .ctr {
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .wind .vals { text-align: left; min-width: 130px; }
  .wind .vals .row1 { display: flex; align-items: baseline; gap: 8px; }
  .wind .vals .big  { font-size: 44px; color: var(--accent); line-height: 1; font-weight: 500; }
  .wind .vals .unit { color: var(--dim); font-size: 13px; }
  .wind .vals .dir { color: var(--text); font-size: 18px; margin-top: 6px; }
  .wind .vals .compass-l { color: var(--cyan); margin-left: 6px; }
  .wind .vals .gust { color: var(--warn); font-size: 13px; margin-top: 4px; min-height: 1em; }
  .wind .vals .vrb  { color: var(--dim); font-size: 13px; font-style: italic; }
  .wind-meta {
    margin-top: 12px; display: flex; justify-content: space-between;
    color: var(--dim); font-size: 11px;
    border-top: 1px solid var(--border); padding-top: 8px;
  }
  .wind-meta .stale { color: var(--warn); }
  .wind-meta .fresh { color: var(--good); }

  /* ── Wind history sparkline ───────── */
  #spark { width: 100%; height: 90px; display: block; }
  .spark-legend {
    display: flex; gap: 18px; font-size: 11px; color: var(--dim); margin-top: 6px;
  }
  .spark-legend .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }

  /* ── Status / sensor list ───────── */
  .status-list { list-style: none; padding: 0; margin: 0; }
  .status-list li {
    display: flex; justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .status-list li:last-child { border-bottom: none; }
  .status-list .ok   { color: var(--good); }
  .status-list .bad  { color: var(--emerg); }
  .status-list .warn { color: var(--warn); }
  .status-list .dim  { color: var(--dim); }

  /* ── Runway wind table ───────── */
  table.rwy-winds, table.alerts, table.radars {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  table.rwy-winds th, table.rwy-winds td,
  table.alerts th, table.alerts td,
  table.radars th, table.radars td {
    text-align: left; padding: 5px 8px;
    border-bottom: 1px solid #1a1a1a;
  }
  table.rwy-winds th, table.alerts th, table.radars th {
    color: var(--dim); font-weight: normal; font-size: 11px; letter-spacing: 1px;
  }
  table.rwy-winds tr td.rwy { color: var(--accent); font-weight: bold; }
  table.rwy-winds tr td.invalid { color: var(--dim); font-style: italic; }
  table.rwy-winds .mini-arrow {
    display: inline-block; width: 12px; height: 12px;
    vertical-align: middle;
    border: 1px solid var(--accent); border-radius: 50%;
    position: relative;
    margin-right: 6px;
  }
  table.rwy-winds .mini-arrow::after {
    content: ""; position: absolute; left: 50%; top: -3px;
    width: 0; height: 0;
    border-left: 3px solid transparent; border-right: 3px solid transparent;
    border-bottom: 7px solid var(--accent);
    transform-origin: 50% 9px;
  }
  table.alerts tr.alert td { color: var(--emerg); }
  table.alerts tr.alert td.t { font-weight: bold; }

  /* ── Hazard/text panels ───────── */
  .text-block {
    background: #050505;
    padding: 10px;
    color: var(--text);
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 12px;
    max-height: 220px;
    overflow-y: auto;
  }

  /* ── Precip canvas ───────── */
  .precip-wrap { display: flex; gap: 12px; align-items: flex-start; }
  #precipCanvas { background: #050505; border: 1px solid var(--border); image-rendering: pixelated; }
  .precip-legend { font-size: 11px; }
  .precip-legend .sw {
    display: inline-block; width: 14px; height: 10px; vertical-align: middle;
    margin-right: 6px; border: 1px solid #000;
  }
  .precip-legend > div { margin: 3px 0; color: var(--dim); }
  .precip-stats { margin-top: 8px; color: var(--dim); font-size: 11px; }
  .precip-stats b { color: var(--text); }

  /* ── Big-number tiles ───────── */
  .big-tile { text-align: center; padding: 8px 0; }
  .big-tile .v { font-size: 40px; line-height: 1; color: var(--accent); }
  .big-tile .v.warn { color: var(--warn); }
  .big-tile .v.good { color: var(--good); }
  .big-tile .l { color: var(--dim); font-size: 11px; margin-top: 4px; }

  /* ── Forecast accuracy grid ───────── */
  .acc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .acc-cell { padding: 6px 8px; border: 1px solid var(--border); border-radius: 2px; text-align: center; }
  .acc-cell .v { font-size: 22px; color: var(--accent); }
  .acc-cell .l { color: var(--dim); font-size: 10px; }
  .acc-cell.n .v { color: var(--dim); }

  /* ── Ribbon display ───────── */
  .ribbon-row {
    font-family: monospace;
    padding: 4px 0;
    display: flex; gap: 12px; align-items: center;
    border-bottom: 1px solid #1a1a1a;
  }
  .ribbon-row .rid { color: var(--accent); min-width: 80px; }
  .ribbon-row .rline { color: var(--text); letter-spacing: 2px; }
  .ribbon-row .rline.empty { color: var(--dim); font-style: italic; }

  /* ── Raw product list ───────── */
  .products-list { font-size: 12px; }
  .product-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; border-bottom: 1px solid #1a1a1a;
  }
  .product-row a { color: var(--dim); text-decoration: none; font-size: 11px; }
  .product-row a:hover { color: var(--accent); }
  .product-row .pname { color: var(--text); }
  .product-row .pmeta { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>ITWS</h1>
  <div class="stats">
    msgs <span class="v" id="msgCount">0</span> ·
    products <span class="v" id="prodCount">0</span> ·
    sites <span class="v" id="siteCount">0</span> ·
    latest <span class="v" id="latestCount">0</span>
  </div>
  <div class="right">
    <a class="api" href="/api/itws/latest" target="_blank">REST API ↗</a>
    <div class="conn bad" id="conn">DISCONNECTED</div>
  </div>
</header>

<div class="layout">
  <div id="airports">
    <h2>AIRPORTS</h2>
    <div id="airportsList"></div>
  </div>
  <div id="dash">
    <div class="empty" id="dashEmpty">
      <div style="color: var(--accent); font-size: 24px;">ITWS</div>
      <div>Integrated Terminal Weather System</div>
      <div>Select an airport to view its weather dashboard</div>
    </div>
    <div id="dashContent" style="display:none"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const state = {
  airports: [],
  selected: null,
  latestByKey: new Map(),
  byAirport: new Map(),
  serverHistory: null,   // last fetched /api/itws/history/{airport}
};

// ───────── Parse helpers ─────────────────────────────
function parseXml(xml) { return new DOMParser().parseFromString(xml, "text/xml"); }
function txt(node, tag) {
  if (!node) return null;
  const el = node.getElementsByTagName(tag)[0];
  return el ? el.textContent.trim() : null;
}
function num(node, tag) {
  const v = txt(node, tag);
  return v === null || v === "" ? null : Number(v);
}
function allOf(node, tag) { return node ? [...node.getElementsByTagName(tag)] : []; }
function epochToDate(sec) {
  if (sec === null || sec === undefined) return null;
  const s = Number(sec);
  if (s <= 0 || !isFinite(s)) return null;
  return new Date(s * 1000);
}
function fmtTime(d) { return d ? d.toISOString().slice(11, 19) + "Z" : "—"; }
function ago(d) {
  if (!d) return "";
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 60) return `${s.toFixed(0)}s ago`;
  if (s < 3600) return `${(s / 60).toFixed(0)}m ago`;
  return `${(s / 3600).toFixed(1)}h ago`;
}
function compass(deg) {
  if (deg === null || deg === undefined || deg === 999 || !isFinite(deg)) return null;
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round((deg % 360) / 22.5) % 16];
}
function fmtDir(d) {
  if (d === null || d === undefined || d === 999) return "VRB";
  return String(d).padStart(3, "0") + "°";
}
function isValidWind(dir, speed) {
  // ITWS uses 999/99 as invalid sentinels for LLWAS sensors
  return dir !== null && dir !== 999 && speed !== null && speed !== 99;
}

// ───────── Product parsers ──────────────────────────
function parseAlerts(xml) {
  const doc = parseXml(xml);
  const ca = doc.getElementsByTagName("configured_alert")[0];
  if (!ca) return null;
  return {
    windDir: num(ca, "ca_aw_wind_dir"),
    windSpeed: num(ca, "ca_aw_wind_speed"),
    gust: num(ca, "ca_aw_gust_speed"),
    windTime: epochToDate(num(ca, "ca_aw_seconds")),
    windExpires: epochToDate(num(ca, "ca_wind_expiration_seconds")),
    radarImpaired: num(ca, "ca_radar_impaired") === 1,
    llwasImpaired: num(ca, "ca_llwas_impaired") === 1,
    runwayConfig: txt(ca, "ca_rwy_name"),
    numRunways: num(ca, "ca_num_rwys"),
    rwyValidTime: epochToDate(num(ca, "ca_rwy_valid_seconds")),
    alerts: allOf(ca, "ca_rwy_alert").map(a => {
      const lwd = num(a, "ca_ra_llwas_wind_dir");
      const lws = num(a, "ca_ra_llwas_wind_speed");
      return {
        region: txt(a, "ca_ra_region_id"),
        type:   (txt(a, "ca_ra_type") || "").trim(),
        value:  num(a, "ca_ra_value"),
        first:  txt(a, "ca_ra_first_loc"),
        last:   txt(a, "ca_ra_last_loc"),
        llwasDir: lwd,
        llwasSpeed: lws,
        llwasValid: isValidWind(lwd, lws),
        ribbons: allOf(a, "ca_ribbon_line").map(rb => ({
          site:  txt(rb, "ca_rib_sd_id"),
          rbdtId:txt(rb, "ca_rib_rbdt_id"),
          lines: txt(rb, "ca_rib_rbdt_lines"),
        })),
      };
    }),
  };
}

function parseGraphics(xml) {
  const doc = parseXml(xml);
  const g = doc.getElementsByTagName("twp_graphics_product")[0];
  if (!g) return null;
  return {
    airport: txt(g, "twp_airport"),
    time: txt(g, "twp_time"),
    range: num(g, "twp_map_range"),
    legend: txt(g, "twp_legend"),
    text: (txt(g, "twp_graphics") || "").trim(),
    legacy: (txt(g, "twp_legacy_map") || "").trim(),
  };
}
function parseTwxText(xml) {
  const doc = parseXml(xml);
  const t = doc.getElementsByTagName("twx_text_prod")[0];
  if (!t) return null;
  return {
    msgType: num(t, "twx_msg_type"),
    size: num(t, "twx_size"),
    text: (txt(t, "twx_text") || "").trim(),
  };
}
function parseHazard(xml) {
  const doc = parseXml(xml);
  const h = doc.getElementsByTagName("haz_text")[0];
  if (!h) return null;
  return { numCells: num(h, "ht_num_cells") || 0 };
}
function parseApStatus(xml) {
  const doc = parseXml(xml);
  const aps = doc.getElementsByTagName("ap_status")[0];
  if (!aps) return null;
  return {
    numRadars: num(aps, "aps_num_rdrs"),
    radars: allOf(aps, "aps_radar").map(r => ({
      source: txt(r, "apsr_source"),
      time: epochToDate(num(r, "apsr_seconds")),
      edit: num(r, "apsr_edit") === 1,
      thresholds: allOf(r, "apsr_data").map(d => ({
        thresh: num(d, "apsd_thresh"),
        area: num(d, "apsd_area"),
        results: num(d, "apsd_results"),
      })),
    })),
  };
}
function parseSmSep(xml) {
  const doc = parseXml(xml);
  const sm = doc.getElementsByTagName("sm_sep")[0];
  if (!sm) return null;
  return {
    numStorms: num(sm, "sm_num_storms") || 0,
    lat: num(sm, "sm_latitude"),
    lon: num(sm, "sm_longitude"),
  };
}
function parseItwsStatus(xml) {
  const doc = parseXml(xml);
  const s = doc.getElementsByTagName("itws_status")[0];
  if (!s) return null;
  return { mode: num(s, "stat_itws_mode"), purged: num(s, "stat_num_products_purged") };
}
function parseForecast(xml) {
  const doc = parseXml(xml);
  const f = doc.getElementsByTagName("forecast_accuracy")[0];
  if (!f) return null;
  return {
    sa30: num(f, "fca_sa30"), sa60: num(f, "fca_sa60"),
    sr30: num(f, "fca_sr30"), sr60: num(f, "fca_sr60"),
    wa30: num(f, "fca_wa30"), wa60: num(f, "fca_wa60"),
    wr30: num(f, "fca_wr30"), wr60: num(f, "fca_wr60"),
  };
}
function parsePrecip(xml) {
  const doc = parseXml(xml);
  const p = doc.getElementsByTagName("precip")[0];
  if (!p) return null;
  const rows = num(p, "prcp_nrows") || 0;
  const cols = num(p, "prcp_ncols") || 0;
  const noCov = num(p, "prcp_no_coverage");
  const apd = num(p, "prcp_ap_detected");
  const att = num(p, "prcp_attenuated");
  const bad = num(p, "prcp_bad_value");
  const enc = txt(p, "prcp_grid_compressed");
  const maxLvl = num(p, "prcp_grid_max_precip_level");
  if (!enc || !rows || !cols) return null;
  const grid = new Uint8Array(rows * cols);
  let i = 0;
  for (const pair of enc.split(/\s+/)) {
    const [v, c] = pair.split(",").map(Number);
    if (!isFinite(v) || !isFinite(c)) continue;
    for (let k = 0; k < c && i < grid.length; k++) grid[i++] = v;
  }
  return { rows, cols, grid, noCov, apd, att, bad, maxLevel: maxLvl };
}

// ───────── Server history fetch ─────────────────────
// History is captured server-side (last 24h) and shared across clients.
// We refetch on airport load + after each WS update for the current airport.
async function fetchHistory(airport) {
  try {
    state.serverHistory = await fetch(`/api/itws/history/${encodeURIComponent(airport)}`).then(r => r.json());
  } catch (e) { state.serverHistory = null; }
}

// ───────── Rendering ─────────────────────────────────
function cardEmpty(title, msg, span) {
  return `<div class="card span${span || 4}"><h3>${title}</h3>
    <div style="color: var(--dim); padding: 6px 0;">${msg}</div></div>`;
}

function renderCompassTicks() {
  const ticks = [];
  const labels = [];
  for (let d = 0; d < 360; d += 10) {
    const cardinal = d % 90 === 0;
    ticks.push(`<div class="tick${cardinal ? " cardinal" : ""}" style="transform: rotate(${d}deg)"></div>`);
  }
  const labelData = [{d:0,l:"N",x:50,y:8},{d:90,l:"E",x:92,y:50},{d:180,l:"S",x:50,y:92},{d:270,l:"W",x:8,y:50}];
  for (const L of labelData) {
    labels.push(`<div class="lbl" style="left:${L.x}%; top:${L.y}%">${L.l}</div>`);
  }
  return ticks.join("") + labels.join("");
}

function renderWindCard(alerts) {
  if (!alerts) return cardEmpty("Surface Wind", "No Configured Alerts product (this airport may not be in the alert subscription)", 5);

  const wd = alerts.windDir;
  const ws = alerts.windSpeed;
  const wg = alerts.gust;
  const ageStr = alerts.windTime ? ago(alerts.windTime) : "";
  const vrb = wd === null || wd === 999;
  const dirText = vrb ? "VRB" : fmtDir(wd);
  const compassText = compass(wd) || "";

  // Wind arrow rotates to point FROM the wind direction (meteorological convention)
  // FROM 270° means wind blowing from West toward East, so arrow points toward 270°
  const arrowRot = vrb ? 0 : wd;

  // Staleness: ITWS surface winds carry an expiration (typically +60s after generation)
  let staleClass = "fresh";
  let staleText = "valid";
  if (alerts.windExpires) {
    const remaining = (alerts.windExpires.getTime() - Date.now()) / 1000;
    if (remaining < 0) { staleClass = "stale"; staleText = `expired ${Math.abs(remaining).toFixed(0)}s ago`; }
    else { staleText = `valid for ${remaining.toFixed(0)}s more`; }
  }

  return `
    <div class="card span5">
      <h3>SURFACE WIND <span class="ago">${ageStr}</span></h3>
      <div class="wind">
        <div class="compass">
          ${renderCompassTicks()}
          <div class="needle" style="transform: translate(-50%, -100%) rotate(${arrowRot}deg)"></div>
          <div class="ctr"></div>
        </div>
        <div class="vals">
          <div class="row1">
            <span class="big">${ws ?? "—"}</span>
            <span class="unit">kt</span>
          </div>
          ${vrb
            ? `<div class="vrb">Variable / no valid direction</div>`
            : `<div class="dir">${dirText}<span class="compass-l">${compassText}</span></div>`}
          <div class="gust">${wg && wg > 0 ? `Gusting ${wg} kt` : ""}</div>
        </div>
      </div>
      <div class="wind-meta">
        <span>${alerts.windTime ? "sampled " + fmtTime(alerts.windTime) : ""}</span>
        <span class="${staleClass}">${staleText}</span>
      </div>
    </div>`;
}

// Time-axis helper: maps an epoch-second timestamp into 0..W
// Always anchor the right edge of the chart to NOW so older samples drift left,
// giving a moving-window feel even when sample frequency is uneven.
function timeXScale(W, samples, getT, windowSec = 86400) {
  const nowSec = Math.floor(Date.now() / 1000);
  const startSec = nowSec - windowSec;
  return (s) => {
    const t = getT(s);
    return ((t - startSec) / windowSec) * W;
  };
}

function hourMarkers(W, H, windowSec = 86400) {
  const nowSec = Math.floor(Date.now() / 1000);
  const startSec = nowSec - windowSec;
  // Vertical gridlines + labels every 4h
  const m = [];
  for (let h = 0; h <= 24; h += 4) {
    const tx = ((((nowSec - h * 3600) - startSec) / windowSec) * W);
    if (tx < 0 || tx > W) continue;
    m.push(`<line x1="${tx}" y1="0" x2="${tx}" y2="${H}" stroke="#181818" stroke-width="1"/>`);
    if (h !== 0) m.push(`<text x="${tx + 3}" y="${H - 2}" font-size="9" fill="#444">-${h}h</text>`);
  }
  return m.join("");
}

function renderWindHistoryCard() {
  const h = state.serverHistory?.wind || [];
  if (h.length < 2) return cardEmpty("Wind Trend (24h)", "Collecting samples — needs ≥2 readings", 7);

  const W = 700, H = 100;
  const ARR_H = 22;
  const speeds = h.map(p => p.speed ?? 0);
  const gusts  = h.map(p => p.gust ?? 0);
  const maxV = Math.max(10, ...speeds, ...gusts);
  const yScale = (v) => H - (v / maxV) * (H - 12) - 6;
  const xScale = timeXScale(W, h, p => p.t);

  const speedPath = h.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p).toFixed(1)} ${yScale(p.speed ?? 0).toFixed(1)}`).join(" ");
  const gustPath  = h.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p).toFixed(1)} ${yScale(p.gust ?? 0).toFixed(1)}`).join(" ");

  // Direction arrows: thin to avoid crowding — only every Nth sample
  const arrowStride = Math.max(1, Math.floor(h.length / 60));
  const arrows = h.map((p, i) => {
    if (i % arrowStride !== 0) return "";
    if (p.dir === null || p.dir === 999) return "";
    const x = xScale(p).toFixed(1);
    return `<g transform="translate(${x},${H + ARR_H / 2}) rotate(${p.dir})">
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#6cf" stroke-width="1"/>
      <polygon points="-2,4 0,8 2,4" fill="#6cf"/>
    </g>`;
  }).join("");

  const spanMin = Math.round((h[h.length - 1].t - h[0].t) / 60);
  const spanLabel = spanMin >= 90 ? `${(spanMin / 60).toFixed(1)}h` : `${spanMin}m`;
  return `
    <div class="card span7">
      <h3>WIND TREND (24h) <span class="ago">${h.length} samples · span ${spanLabel}</span></h3>
      <svg id="spark" viewBox="0 0 ${W} ${H + ARR_H}" preserveAspectRatio="none">
        ${hourMarkers(W, H)}
        <line x1="0" y1="${H - 6}" x2="${W}" y2="${H - 6}" stroke="#222" stroke-width="1"/>
        <path d="${gustPath}" stroke="var(--warn)" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="${speedPath}" stroke="var(--accent)" stroke-width="2" fill="none"/>
        <text x="4" y="12" fill="#888" font-size="10">${maxV} kt</text>
        <text x="4" y="${H - 8}" fill="#888" font-size="10">0</text>
        ${arrows}
      </svg>
      <div class="spark-legend">
        <span><span class="sw" style="background: var(--accent)"></span>speed</span>
        <span><span class="sw" style="background: var(--warn)"></span>gust</span>
        <span style="color: var(--cyan)">↓ arrows = wind FROM direction</span>
        <span style="margin-left:auto; color: var(--dim)">x-axis: 24h, now on right</span>
      </div>
    </div>`;
}

function renderStormTrendCard() {
  const h = state.serverHistory?.storms?.tracon || [];
  if (h.length < 2) return ""; // omit when no data
  const W = 500, H = 60;
  const maxV = Math.max(2, ...h.map(p => p.count ?? 0));
  const yScale = (v) => H - (v / maxV) * (H - 8) - 4;
  const xScale = timeXScale(W, h, p => p.t);
  const path = h.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p).toFixed(1)} ${yScale(p.count ?? 0).toFixed(1)}`).join(" ");
  return `<div class="card span6">
    <h3>STORM CELLS (24h)</h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%; height:60px; display:block;">
      ${hourMarkers(W, H)}
      <path d="${path}" stroke="var(--warn)" stroke-width="1.5" fill="none"/>
      <text x="4" y="12" fill="#888" font-size="10">${maxV}</text>
    </svg>
    <div class="spark-legend"><span style="color: var(--dim)">TRACON cell count over time</span></div>
  </div>`;
}

function renderPrecipTrendCard() {
  const h = state.serverHistory?.precip?.tracon || [];
  if (h.length < 2) return "";
  const W = 500, H = 60;
  const yScale = (v) => H - ((v ?? 0) / 6) * (H - 8) - 4;
  const xScale = timeXScale(W, h, p => p.t);
  const path = h.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p).toFixed(1)} ${yScale(p.maxLevel ?? 0).toFixed(1)}`).join(" ");
  return `<div class="card span6">
    <h3>PRECIP MAX LEVEL (24h)</h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%; height:60px; display:block;">
      ${hourMarkers(W, H)}
      <path d="${path}" stroke="var(--nws3)" stroke-width="1.5" fill="none"/>
      <text x="4" y="12" fill="#888" font-size="10">6</text>
      <text x="4" y="${H - 6}" fill="#888" font-size="10">0</text>
    </svg>
    <div class="spark-legend"><span style="color: var(--dim)">Highest NWS precip level seen in TRACON each sample</span></div>
  </div>`;
}

function renderRunwayWindsCard(alerts) {

  const validCount = alerts.alerts.filter(a => a.llwasValid).length;
  const note = alerts.llwasImpaired
    ? `<span class="ago" style="color: var(--emerg)">LLWAS IMPAIRED — sensor data may be unavailable</span>`
    : `<span class="ago">${validCount}/${alerts.alerts.length} sensors reporting</span>`;

  const rows = alerts.alerts.map(a => {
    if (a.llwasValid) {
      const rot = a.llwasDir;
      const c = compass(a.llwasDir);
      return `<tr>
        <td class="rwy">${a.region}</td>
        <td>
          <span class="mini-arrow" style="transform: rotate(0deg)">
            <style scoped></style>
          </span>
          ${fmtDir(a.llwasDir)} ${c ? `<span style="color:var(--cyan)">${c}</span>` : ""}
        </td>
        <td>${a.llwasSpeed} kt</td>
        <td style="color:${a.type ? "var(--emerg)" : "var(--good)"}">${a.type || "clear"}</td>
      </tr>`;
    } else {
      return `<tr>
        <td class="rwy">${a.region}</td>

        <td style="color:${a.type ? "var(--emerg)" : "var(--dim)"}">${a.type || "—"}</td>

  return `
    <div class="card span6">
      <h3>PER-RUNWAY WINDS (LLWAS) ${note}</h3>
      <table class="rwy-winds">
        <thead><tr><th>REGION</th><th>WIND FROM</th><th>SPEED</th><th>ALERT</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:8px; color: var(--dim); font-size: 11px;">
        Region codes: <b style="color:var(--text)">XXRA/RD</b> = runway 27 right arr/dep ·
        <b style="color:var(--text)">XX A/D</b> = arr/dep on single runway
      </div>
    </div>`;
}

function renderStatusCard(alerts, ap, itws) {
  const rows = [];
  if (alerts) {
    rows.push(`<li><span>Radar feed</span><span class="${alerts.radarImpaired ? "bad" : "ok"}">${alerts.radarImpaired ? "IMPAIRED" : "OK"}</span></li>`);
    rows.push(`<li><span>LLWAS feed</span><span class="${alerts.llwasImpaired ? "bad" : "ok"}">${alerts.llwasImpaired ? "IMPAIRED" : "OK"}</span></li>`);
    if (alerts.runwayConfig)
      rows.push(`<li><span>Runway config</span><span>${alerts.runwayConfig}</span></li>`);
    if (alerts.numRunways)
      rows.push(`<li><span>Runway regions</span><span>${alerts.numRunways}</span></li>`);
  }
  if (itws) {
    rows.push(`<li><span>ITWS mode</span><span class="${itws.mode === 0 ? "ok" : "warn"}">${itws.mode === 0 ? "NORMAL" : "MODE " + itws.mode}</span></li>`);
    if (itws.purged > 0) rows.push(`<li><span>Purged products</span><span class="warn">${itws.purged}</span></li>`);
  }

function renderRadarsCard(ap) {
  if (!ap || !ap.radars || ap.radars.length === 0) return "";
  const rows = ap.radars.map(r => `
    <tr>
      <td style="color: var(--accent)">${r.source}</td>
      <td>${fmtTime(r.time)}</td>
      <td class="${r.edit ? "warn" : "ok"}" style="color: ${r.edit ? "var(--warn)" : "var(--good)"}">${r.edit ? "EDIT" : "OK"}</td>
      <td style="color: var(--dim); font-size: 11px;">${r.thresholds.map(t => `L${t.thresh}:${t.results}`).join(" ")}</td>
    </tr>`).join("");
  return `
    <div class="card span4">
      <h3>RADAR FEEDS (${ap.numRadars || ap.radars.length})</h3>
      <table class="radars">
        <thead><tr><th>SOURCE</th><th>LAST</th><th>STATE</th><th>AP DETECTED</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:6px; color: var(--dim); font-size: 11px;">

}

function renderAlertsCard(alerts) {
  if (!alerts) return cardEmpty("Runway Alerts", "No Configured Alerts product", 4);
  const active = alerts.alerts.filter(a => a.type);
  let body;
  if (active.length === 0) {
    body = `<div style="color: var(--good); padding: 6px 0;">No active wind shear / microburst alerts.
      <div style="color: var(--dim); margin-top:4px; font-size: 11px;">${alerts.alerts.length} runway regions monitored.</div></div>`;
  } else {
    body = `<table class="alerts">
      <thead><tr><th>RWY</th><th>TYPE</th><th>VALUE</th><th>FIRST</th><th>LAST</th></tr></thead>
      <tbody>${active.map(a => `<tr class="alert">
        <td class="t">${a.region}</td><td class="t">${a.type}</td>
        <td>${a.value !== null ? a.value + " kt" : ""}</td>
        <td>${a.first || ""}</td><td>${a.last || ""}</td>
      </tr>`).join("")}</tbody></table>`;
  }
  return `<div class="card span4"><h3>ALERTS</h3>${body}</div>`;
}

function renderRibbonCard(alerts) {
  if (!alerts) return "";
  // Aggregate unique ribbons across all runway-alerts (each ribbon SD+RBDT pair shows once)
  const seen = new Map();
  for (const a of alerts.alerts) {
    for (const r of a.ribbons) {
      const k = `${r.site}|${r.rbdtId}`;
      if (!seen.has(k)) seen.set(k, r);
    }
  }
  if (seen.size === 0) return "";
  const rows = [...seen.values()].map(r => {
    const empty = !r.lines || /^0+$/.test(r.lines);
    return `<div class="ribbon-row">
      <span class="rid">${r.site}/${r.rbdtId}</span>
      <span class="rline ${empty ? "empty" : ""}">${empty ? "(no display content)" : r.lines}</span>
    </div>`;
  }).join("");
  return `<div class="card span4">
    <h3>RIBBON DISPLAYS</h3>
    <div>${rows}</div>
    <div style="margin-top:6px; color: var(--dim); font-size: 11px;">
      Live ribbon-display unit content sent to tower / TRACON cabs. Mostly idle when no convective activity.
    </div></div>`;
}

function renderForecastCard(f) {
  if (!f) return "";
  const cells = [
    ["sa30", "Storm Accuracy 30m", f.sa30], ["sa60", "Storm Accuracy 60m", f.sa60],
    ["sr30", "Storm Recall 30m",  f.sr30], ["sr60", "Storm Recall 60m",  f.sr60],
    ["wa30", "Weather Acc 30m",   f.wa30], ["wa60", "Weather Acc 60m",   f.wa60],

function renderPrecipCard(precip) {
  if (!precip) return cardEmpty("Precipitation Grid", "No precip product", 8);
  const pctLevels = countPrecipLevels(precip);
  return `
    <div class="card span8">
      <h3>PRECIPITATION (TRACON, ${precip.cols}×${precip.rows} @ 1 km/cell)</h3>
      <div class="precip-wrap">
        <canvas id="precipCanvas" width="${precip.cols}" height="${precip.rows}"
                style="width:${Math.min(precip.cols, 500)}px; height:auto;"></canvas>
        <div>
          <div class="precip-legend">
            <div><span class="sw" style="background: var(--nws1)"></span>Level 1 — light</div>
            <div><span class="sw" style="background: var(--nws2)"></span>Level 2 — moderate</div>
            <div><span class="sw" style="background: var(--nws3)"></span>Level 3 — heavy</div>
            <div><span class="sw" style="background: var(--nws4)"></span>Level 4 — very heavy</div>
            <div><span class="sw" style="background: var(--nws5)"></span>Level 5 — extreme</div>
            <div><span class="sw" style="background: var(--nws6)"></span>Level 6 — hail/severe</div>
            <div><span class="sw" style="background: #333"></span>No coverage</div>
          </div>
          <div class="precip-stats">
            Max level seen: <b>${precip.maxLevel ?? 0}</b><br>
            Cells with precip: <b>${pctLevels.precipCells.toLocaleString()}</b>
              (${pctLevels.pctPrecip.toFixed(1)}%)<br>
            No-coverage cells: <b>${pctLevels.noCovCells.toLocaleString()}</b>
              (${pctLevels.pctNoCov.toFixed(1)}%)
          </div>
        </div>
      </div>
    </div>`;
}

function countPrecipLevels(precip) {
  let precipCells = 0, noCovCells = 0, total = precip.rows * precip.cols;
  for (let i = 0; i < precip.grid.length; i++) {
    const v = precip.grid[i];
    if (v === precip.noCov) noCovCells++;
    else if (v >= 1 && v <= 6) precipCells++;
  }
  return {
    precipCells, noCovCells,
    pctPrecip: (precipCells / total) * 100,
    pctNoCov: (noCovCells / total) * 100,
  };
}

function paintPrecip(precip) {
  if (!precip) return;
  const cnv = document.getElementById("precipCanvas");
  if (!cnv) return;
  const ctx = cnv.getContext("2d");
  const img = ctx.createImageData(precip.cols, precip.rows);
  const palette = {
    0: [10, 10, 10, 255],
    1: [0, 176, 80, 255], 2: [0, 255, 0, 255],
    3: [255, 255, 0, 255], 4: [255, 128, 0, 255],
    5: [255, 0, 0, 255], 6: [255, 0, 255, 255],
  };
  for (let y = 0; y < precip.rows; y++) {
    for (let x = 0; x < precip.cols; x++) {
      const v = precip.grid[y * precip.cols + x];
      let c;
      if (v === precip.noCov) c = [50, 50, 50, 255];
      else if (v === precip.bad) c = [80, 0, 80, 255];
      else if (v === precip.apd) c = [40, 40, 60, 255];
      else if (v === precip.att) c = [60, 60, 40, 255];
      else c = palette[v] || [25, 25, 25, 255];
      const o = (y * precip.cols + x) * 4;
      img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2]; img.data[o+3]=c[3];
    }
  }
  ctx.putImageData(img, 0, 0);
}

function renderProductsCard(airport) {
  const list = state.byAirport.get(airport);
  if (!list) return "";
  const items = [];
  for (const [, msgs] of list) for (const m of msgs) items.push(m);
  items.sort((a, b) => a.productType.localeCompare(b.productType) || (a.subId || "").localeCompare(b.subId || ""));
  return `
    <div class="card span12">
      <h3>ALL ${items.length} PRODUCTS</h3>
      <div class="products-list">
        ${items.map(m => `<div class="product-row">
          <span class="pname">${m.productType}${m.subId ? ` · <span style="color:var(--accent)">${m.subId}</span>` : ""}</span>
          <span class="pmeta">${ago(new Date(m.receivedAt))} · ${m.xmlSize}B ·
            <a href="/api/itws/raw-by-key?key=${encodeURIComponent(m.key)}" target="_blank">XML ↗</a></span>
        </div>`).join("")}
      </div>
    </div>`;
}

// ───────── Dashboard build ──────────────────────────
async function loadAirport(airport) {
  state.selected = airport;
  $("dashEmpty").style.display = "none";
  $("dashContent").style.display = "block";
  if (!$("dashContent").innerHTML) {
    $("dashContent").innerHTML = `<div class="empty">Loading ${airport}…</div>`;
  }

  let data;
  try {
    data = await fetch(`/api/itws/airport/${encodeURIComponent(airport)}`).then(r => r.json());
  } catch (e) {
    $("dashContent").innerHTML = `<div class="empty">Failed to load ${airport}</div>`;
    return;
  }

  const byType = new Map();
  for (const m of data.products) {
    if (!byType.has(m.productType)) byType.set(m.productType, []);
    byType.get(m.productType).push(m);
  }
  state.byAirport.set(airport, byType);

  const findXml = (type) => {
    const list = byType.get(type);
    return list && list.length ? list[0].rawXml : null;
  };

  const alerts = (() => { const x = findXml("Configured Alerts Product"); return x ? parseAlerts(x) : null; })();
  const graphics = (() => { const x = findXml("Terminal Weather Graphics Product"); return x ? parseGraphics(x) : null; })();
  const twxText = (() => { const x = findXml("Terminal Weather Text Normal Product"); return x ? parseTwxText(x) : null; })();
  const hazard = (() => { const x = findXml("Hazard Text TRACON Product"); return x ? parseHazard(x) : null; })();
  const ap = (() => { const x = findXml("AP Status"); return x ? parseApStatus(x) : null; })();
  const sm = (() => {
    const x = findXml("SM SEP TRACON Product") || findXml("SM SEP 5nm Product");
    return x ? parseSmSep(x) : null;
  })();
  const itws = (() => { const x = findXml("ITWS Status Information"); return x ? parseItwsStatus(x) : null; })();
  const fcst = (() => { const x = findXml("Forecast Accuracy Product"); return x ? parseForecast(x) : null; })();
  const precip = (() => {
    const x = findXml("Precipitation TRACON Product") || findXml("Precipitation 5nm Product");
    return x ? parsePrecip(x) : null;
  })();

  // History (24h trends) is captured server-side. Fetch in parallel with re-render.
  await fetchHistory(airport);

  $("dashContent").innerHTML = `
    <div class="grid">
      ${renderWindCard(alerts)}
      ${renderWindHistoryCard()}
      ${renderRunwayWindsCard(alerts)}
      ${renderStatusCard(alerts, ap, itws)}
      ${renderStormCard(sm)}
      ${renderAlertsCard(alerts)}
      ${renderRibbonCard(alerts)}
      ${renderRadarsCard(ap)}
      ${renderForecastCard(fcst)}
      ${renderStormTrendCard()}
      ${renderPrecipTrendCard()}
      ${renderHazardCard(graphics, twxText)}
      ${renderPrecipCard(precip)}
      ${renderProductsCard(airport)}
    </div>`;

  if (precip) paintPrecip(precip);
  for (const el of document.querySelectorAll(".ap-row")) {
    el.classList.toggle("active", el.dataset.ap === airport);
  }
  history.replaceState({}, "", `/itws/${airport}`);
}

// ───────── Airport list / polling / WS ──────────────
function renderAirports() {
  const html = state.airports
    .filter(a => a.airport !== "ALL" && a.airport !== "000")
    .map(a => `<div class="ap-row${state.selected === a.airport ? " active" : ""}" data-ap="${a.airport}">
      <span class="n">${a.airport}</span><span class="c">${a.products.length}p</span></div>`)
    .join("");
  $("airportsList").innerHTML = html;
  for (const el of document.querySelectorAll(".ap-row")) {
    el.onclick = () => loadAirport(el.dataset.ap);
  }
}

let ws = null;
function connectWs() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/itws/ws");
  ws.onopen = () => { $("conn").textContent = "LIVE"; $("conn").className = "conn ok"; };
  ws.onclose = () => {
    $("conn").textContent = "DISCONNECTED";
    $("conn").className = "conn bad";
    setTimeout(connectWs, 5000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "update") {
      state.latestByKey.set(m.data.key, m.data);
      if (state.selected && m.data.site === state.selected) scheduleRefresh();
    } else if (m.type === "snapshot") {
      for (const item of m.data) state.latestByKey.set(item.key, item);
    }
  };
}
let refreshTimer = null;
function scheduleRefresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => {
    refreshTimer = null;
    if (state.selected) loadAirport(state.selected);
  }, 1500);
}
async function pollOverview() {
  try {
    const [stats, airports] = await Promise.all([
      fetch("/api/itws/stats").then(r => r.json()),
      fetch("/api/itws/airports").then(r => r.json()),
    ]);
    $("msgCount").textContent = stats.messageCount.toLocaleString();
    $("prodCount").textContent = stats.productTypeCount;
    $("siteCount").textContent = stats.siteCount;
    $("latestCount").textContent = stats.latestCount;
    state.airports = airports;
    renderAirports();
  } catch (e) { /* ignore */ }
}

// ───────── Bootstrap ────────────────────────────────
{
  const m = location.pathname.match(/^\/itws\/([A-Za-z0-9]+)\/?$/);
  if (m) state.selected = m[1].toUpperCase();
}
connectWs();
pollOverview().then(() => { if (state.selected) loadAirport(state.selected); });
setInterval(pollOverview, 10000);
setInterval(() => { if (state.selected) loadAirport(state.selected); }, 30000);
</script>
</body>
