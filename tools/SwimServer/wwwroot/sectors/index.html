<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFDPS - Sectors & Tracks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📊</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#0a0a0a; --panel:#141414; --border:#2a2a2a; --text:#d4d4aa;
    --dim:#888; --accent:#cccc44; --good:#6f6; --warn:#ff8c00; --emerg:#ff4444;
  }
  *  { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace; font-size:13px; }
  header {
    display:flex; align-items:baseline; gap:12px;
    padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  header a.home { color:var(--dim); text-decoration:none; padding:2px 6px; border:1px solid var(--border); border-radius:3px; font-size:11px; }
  header a.home:hover { color:var(--accent); border-color:var(--accent); }
  header h1 { font-size:18px; color:var(--accent); margin:0; letter-spacing:1px; }
  header .sub { color:var(--dim); font-size:11px; letter-spacing:0.5px; }
  header .right { margin-left:auto; display:flex; gap:14px; align-items:baseline; }
  header .right .stat b { color:var(--text); }
  header .right .stat { color:var(--dim); font-size:11px; }

  .controls {
    padding:8px 16px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--border); background:#0e0e0e;
  }
  .controls input[type="text"],
  .controls select {
    background:#1a1a1a; color:var(--text); border:1px solid #333;
    padding:3px 8px; font-family:inherit; font-size:12px;
  }
  .controls input[type="text"] { min-width:200px; }
  .controls .lbl { color:var(--dim); font-size:11px; }
  .controls .reload-note { color:var(--dim); font-size:11px; margin-left:auto; }

  main { padding:16px; display:grid; grid-template-columns: 280px 1fr; gap:16px; max-width:1600px; margin:0 auto; }
  .fac-list {
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    overflow:hidden; max-height:calc(100vh - 140px); overflow-y:auto;
  }
  .fac-list .row {
    display:flex; align-items:center; gap:8px;
    padding:6px 10px; cursor:pointer; border-bottom:1px solid #1f1f1f;
    transition:background-color .08s;
  }
  .fac-list .row:hover { background:#1a1a1a; }
  .fac-list .row.active { background:#2d2d10; color:var(--accent); border-left:3px solid var(--accent); padding-left:7px; }
  .fac-list .row .name { font-weight:bold; font-size:13px; min-width:50px; }
  .fac-list .row .stats { color:var(--dim); font-size:10px; margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; }
  .fac-list .row.active .stats { color:#bb9; }
  .fac-list .row .tracks { color:var(--accent); font-weight:bold; }

  .detail {
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    padding:16px;
  }
  .detail h2 {
    margin:0 0 6px 0; color:var(--accent); font-size:18px;
    display:flex; gap:14px; align-items:baseline;
  }
  .detail h2 small { color:var(--dim); font-size:11px; font-weight:normal; }
  .summary {
    display:flex; gap:24px; margin-bottom:18px; padding-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .summary .stat { color:var(--dim); font-size:11px; }
  .summary .stat b { display:block; color:var(--text); font-size:22px; font-weight:bold; }
  .summary .stat.accent b { color:var(--accent); }

  .sec-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:8px;
  }
  .sec-cell {
    background:#1a1a1a; border:1px solid #333; border-radius:3px;
    padding:8px; display:flex; flex-direction:column; gap:3px;
    cursor:pointer; transition:border-color .08s, background-color .08s;
  }
  .sec-cell:hover { border-color:var(--accent); }
  .sec-cell.selected { border-color:var(--accent); background:#2a2a10; }
  .sec-cell .top { display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .sec-cell .id {
    color:var(--accent); font-weight:bold; font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .sec-cell .tracks { color:var(--text); font-size:13px; font-variant-numeric:tabular-nums; }
  .sec-cell .meta { color:var(--dim); font-size:10px; display:flex; gap:8px; }
  .sec-cell .meta span.h-in  { color:var(--good); }
  .sec-cell .meta span.h-out { color:var(--warn); }
  .sec-cell .spark { display:block; width:100%; height:16px; }
  .sec-cell.zero { opacity:0.55; }
  .sec-cell.zero .id { color:#888; }

  /* Markov transition panel */
  .trans-panel {
    margin-top:16px; padding-top:12px; border-top:1px solid var(--border);
  }
  .trans-panel h3 {
    margin:0 0 6px 0; color:var(--accent); font-size:14px; letter-spacing:1px;
    display:flex; align-items:baseline; gap:8px;
  }
  .trans-panel h3 small { color:var(--dim); font-weight:normal; font-size:10px; }
  .trans-cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .trans-col { background:#0e0e0e; border:1px solid var(--border); border-radius:3px; padding:10px; }
  .trans-col .title { font-size:11px; color:var(--dim); letter-spacing:1px; margin-bottom:8px; }
  .trans-col .title.in { color:var(--good); }
  .trans-col .title.out { color:var(--warn); }
  .trans-row {
    display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .trans-row .who { flex:1; color:var(--text); }
  .trans-row .cnt { color:var(--dim); min-width:30px; text-align:right; }
  .trans-row .bar { height:4px; background:#222; flex:1; max-width:80px; border-radius:2px; overflow:hidden; }
  .trans-row .bar > i { display:block; height:100%; background:var(--accent); }
  .trans-row.in .bar > i  { background:var(--good); }
  .trans-row.out .bar > i { background:var(--warn); }

  .empty { color:var(--dim); padding:24px; text-align:center; }

  .split-section {
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .split-section h3 {
    margin: 0 0 8px 0; color: var(--accent); font-size: 14px; letter-spacing: 1px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .split-section h3 small { color: var(--dim); font-weight: normal; font-size: 10px; }
  #splitMap {
    height: 420px; background: #000;
    border: 1px solid var(--border); border-radius: 4px;
  }
  #splitLegend {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 8px; font-size: 11px;
  }
  #splitLegend .leg-item { display: flex; align-items: center; gap: 6px; }
  #splitLegend .swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #444; }
  #splitLegend .leg-primary { color: var(--accent); font-weight: bold; }
  #splitLegend .leg-secs { color: var(--dim); }
  .split-label {
    background: transparent !important; border: none !important;
    color: #fff; font-weight: bold; font-size: 13px; letter-spacing: 0.5px;
    text-shadow: 0 0 4px #000, 0 0 2px #000;
    white-space: nowrap;
  }
  .split-no-data { color: var(--dim); font-size: 11px; padding: 8px 0; }

  @media (max-width:900px) {
    main { grid-template-columns:1fr; }
    .fac-list { max-height:none; }
  }
</style>
</head>
<body>
<header>
    <a class="home" href="/">← HOME</a>
    <h1>SECTORS</h1>
    <span class="sub">Active sectors & tracks per facility — live SFDPS</span>
    <div class="right">
        <span class="stat">Facilities <b id="totFac">—</b></span>
        <span class="stat">Sectors <b id="totSec">—</b></span>
        <span class="stat">Tracks <b id="totTrk">—</b></span>
        <span class="stat">Updated <b id="updated">—</b></span>
    </div>
</header>
<div class="controls">
    <span class="lbl">FILTER</span>
    <input type="text" id="filter" placeholder="Facility ID (e.g. ZDC, ZTL)…" autofocus>
    <span class="lbl" style="margin-left:14px;">WINDOW</span>
    <select id="rangeSel" title="Time range shown on the per-sector sparkline">
        <option value="60">1 h</option>
        <option value="180">3 h</option>
        <option value="360">6 h</option>
        <option value="720">12 h</option>
        <option value="1440">24 h</option>
    </select>
    <span class="reload-note">Auto-refreshes every 5s</span>
</div>
<main>
    <div class="fac-list" id="facList"><div class="empty">Loading…</div></div>
    <div class="detail" id="detail"><div class="empty">Select a facility on the left</div></div>
</main>

<script>
const facList = document.getElementById("facList");
const detail = document.getElementById("detail");
const filter = document.getElementById("filter");
const rangeSel = document.getElementById("rangeSel");
let data = [];        // array of facilities (was the whole body before; now from `.facilities`)
let rangeMin = 60;    // mirrors rangeSel
let selected = null;

// Allow ?facility=ZDC and ?range=180 in the URL.
const initParams = new URLSearchParams(location.search);
const initFac = initParams.get("facility");
if (initFac) selected = initFac.toUpperCase();
const initRange = initParams.get("range");
if (initRange && /^\d+$/.test(initRange)) {
    rangeMin = parseInt(initRange, 10);
    if (rangeSel) rangeSel.value = String(rangeMin);
}

async function refresh() {
    try {
        const r = await fetch(`/api/sectors?rangeMin=${rangeMin}`);
        const body = await r.json();
        // Backwards-compat: older responses were a bare facility array.
        data = Array.isArray(body) ? body : (body.facilities || []);
        document.getElementById("totFac").textContent = data.length;
        document.getElementById("totSec").textContent = data.reduce((a, f) => a + f.sectorCount, 0);
        document.getElementById("totTrk").textContent = data.reduce((a, f) => a + f.totalTracks, 0).toLocaleString();
        document.getElementById("updated").textContent = new Date().toISOString().slice(11, 19) + "Z";
        renderList();
        renderDetail();
    } catch (e) {
        facList.innerHTML = `<div class="empty">Error loading /api/sectors</div>`;
    }
}

function renderList() {
    const q = filter.value.trim().toUpperCase();
    const filtered = q ? data.filter(d => d.facility.toUpperCase().includes(q)) : data;
    if (!filtered.length) { facList.innerHTML = `<div class="empty">No facilities match</div>`; return; }
    facList.innerHTML = filtered.map(d => {
        const active = selected === d.facility ? " active" : "";
        return `<div class="row${active}" data-fac="${d.facility}">
            <span class="name">${d.facility}</span>
            <span class="stats"><span class="tracks">${d.totalTracks}</span> trk · ${d.sectorCount} sec</span>
        </div>`;
    }).join("");
    facList.querySelectorAll(".row").forEach(el => {
        el.addEventListener("click", () => {
            const newFac = el.dataset.fac;
            // Switching facility invalidates any sector selection from the
            // previous facility — its transitions panel was facility-scoped.
            if (newFac !== selected) {
                selectedSector = null;
                transitionsCache = null;
            }
            selected = newFac;
            const url = new URL(location.href);
            url.searchParams.set("facility", selected);
            url.searchParams.delete("sector");
            history.replaceState(null, "", url);
            renderList(); renderDetail();
        });
    });
}

let selectedSector = null;     // sector ID within the current facility
let transitionsCache = null;   // last fetched { into, outOf }
const initSec = (new URLSearchParams(location.search)).get("sector");
if (initSec) selectedSector = initSec.toUpperCase();

// Build an inline SVG sparkline path for the per-sector history array. The
// poly-line is normalized against the local max (so a sector with steady 1
// track is still visibly flat, not a screaming spike). Empty / all-zero
// histories return a tiny baseline so the cell still looks consistent.
function sparkSvg(history, w = 100, h = 16) {
    if (!history || history.length === 0) return "";
    const max = Math.max(1, ...history);
    const stepX = w / Math.max(1, history.length - 1);
    const pts = history.map((v, i) => {
        const x = i * stepX;
        const y = h - 1 - (v / max) * (h - 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline fill="none" stroke="var(--accent)" stroke-width="1" points="${pts.join(' ')}"/>
    </svg>`;
}

function renderDetail() {
    if (!selected) { detail.innerHTML = `<div class="empty">Select a facility on the left</div>`; return; }
    const d = data.find(x => x.facility === selected);
    if (!d) { detail.innerHTML = `<div class="empty">${selected} has no current tracks</div>`; return; }
    const rangeLabel = rangeMin >= 60
        ? `${rangeMin / 60} h`
        : `${rangeMin} min`;
    detail.innerHTML = `
        <h2>${d.facility} <small>${d.sectorCount} active sectors / ${d.sectors.length} known &middot; sparkline ${rangeLabel} (oldest → now)</small></h2>
        <div class="summary">
            <div class="stat accent"><b>${d.totalTracks}</b>Tracks</div>
            <div class="stat accent"><b>${d.sectorCount}</b>Active sectors</div>
            <div class="stat"><b>${d.sectors.reduce((a,s)=>a+s.handoffsIn,0)}</b>Handoffs in</div>
            <div class="stat"><b>${d.sectors.reduce((a,s)=>a+s.handoffsOut,0)}</b>Handoffs out</div>
        </div>
        <div class="split-section" id="splitSection">
            <h3>SECTOR SPLIT MAP <small id="splitMapMeta">loading assignment data…</small></h3>
            <div id="splitMap"></div>
            <div id="splitLegend"></div>
        </div>
        <div class="sec-grid" id="secGrid">
        ${d.sectors.map(s => {
            const zero = s.tracks === 0 ? ' zero' : '';
            const sel  = s.id === selectedSector ? ' selected' : '';
            const hin  = s.handoffsIn  ? `<span class="h-in">↘${s.handoffsIn}</span>` : '';
            const hout = s.handoffsOut ? `<span class="h-out">↗${s.handoffsOut}</span>` : '';
            const meta = (hin || hout) ? `<div class="meta">${hin}${hout}</div>` : '';
            return `<div class="sec-cell${zero}${sel}" data-sec="${s.id}" title="Sector ${s.id}">
                <div class="top">
                    <span class="id">${s.id}</span>
                    <span class="tracks">${s.tracks} trk</span>
                </div>
                ${sparkSvg(s.history)}
                ${meta}
            </div>`;
        }).join("")}
        </div>
        <div class="trans-panel" id="transPanel" ${selectedSector ? '' : 'style="display:none;"'}>
        </div>`;

    detail.querySelectorAll(".sec-cell").forEach(el => {
        el.addEventListener("click", () => {
            selectedSector = (selectedSector === el.dataset.sec) ? null : el.dataset.sec;
            const url = new URL(location.href);
            if (selectedSector) url.searchParams.set("sector", selectedSector);
            else url.searchParams.delete("sector");
            history.replaceState(null, "", url);
            transitionsCache = null;
            renderDetail();
            if (selectedSector) loadTransitions();
        });
    });
    if (selectedSector) renderTransitionPanel();
    renderSplitMap(d.facility);
}

// ── Sector split map (Leaflet + KML + AIXM assignments) ───────────────────
const SPLIT_MAP_CATS = ['Ultra High', 'High Altitude'];
const GROUP_COLORS = ['#3366cc', '#33aa66', '#cc8833', '#aa44aa', '#33aaaa', '#cccc44', '#cc5555', '#6666cc', '#88aa33', '#cc6699'];

let splitMap = null;
let splitMapLayer = null;
let kmlSectorsCache = null;
let airspaceCache = {};

function colorForPrimary(primary) {
    let h = 0;
    const s = String(primary);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return GROUP_COLORS[h % GROUP_COLORS.length];
}

function closeRing(coords) {
    if (coords.length < 3) return coords;
    const [fLat, fLon] = coords[0];
    const [lLat, lLon] = coords[coords.length - 1];
    if (fLat === lLat && fLon === lLon) return coords;
    return [...coords, coords[0]];
}

function ringCentroid(coords) {
    let lat = 0, lon = 0;
    for (const [la, lo] of coords) { lat += la; lon += lo; }
    return [lat / coords.length, lon / coords.length];
}

async function loadKmlSectors() {
    if (kmlSectorsCache) return kmlSectorsCache;
    const resp = await fetch('/api/kml/AllSectors.kml');
    if (!resp.ok) return [];
    const text = await resp.text();
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const out = [];
    for (const pm of xml.querySelectorAll('Placemark')) {
        const name = pm.querySelector('name')?.textContent || '';
        const desc = pm.querySelector('description')?.textContent || '';
        const coordEl = pm.querySelector('coordinates');
        if (!coordEl) continue;
        const descDoc = new DOMParser().parseFromString(desc, 'text/html');
        const tds = descDoc.querySelectorAll('td');
        const data = {};
        for (let i = 0; i < tds.length - 1; i += 2)
            data[tds[i].textContent.trim()] = tds[i + 1].textContent.trim();
        const folderPath = data['FolderPath'] || '';
        const parts = folderPath.split('/');
        let artcc = parts.length >= 2 ? parts[1] : '';
        let category = '';
        let sectorId = name;
        if (artcc) {
            const catRaw = parts.length >= 3 ? parts[2] : '';
            category = catRaw.replace(/\s*\(\d+\)$/, '');
            sectorId = parts.length >= 4 ? parts[3] : name;
        } else {
            let el = pm.parentElement;
            while (el) {
                const fn = el.tagName === 'Folder' ? (el.querySelector(':scope > name')?.textContent || '') : '';
                const m = fn.match(/^(Z[A-Z]{2})[_ ]/);
                if (m) {
                    artcc = m[1];
                    const upper = fn.toUpperCase();
                    if (upper.includes('ULTRA')) category = 'Ultra High';
                    else if (upper.includes('HIGH')) category = 'High Altitude';
                    else if (upper.includes('LOW')) category = 'Low Altitude';
                    else if (upper.includes('APPROACH')) category = 'Approach Control';
                    else category = 'High Altitude';
                    break;
                }
                el = el.parentElement;
            }
        }
        if (!artcc) continue;
        const coords = coordEl.textContent.trim().split(/\s+/).map(c => {
            const [lon, lat] = c.split(',');
            return [parseFloat(lat), parseFloat(lon)];
        }).filter(c => !isNaN(c[0]) && !isNaN(c[1]));
        if (coords.length < 3) continue;
        out.push({ artcc, sectorId, category, coords });
    }
    kmlSectorsCache = out;
    return out;
}

async function fetchAirspace(facility) {
    if (airspaceCache[facility]?.fetchedAt && Date.now() - airspaceCache[facility].fetchedAt < 55000)
        return airspaceCache[facility].data;
    try {
        const r = await fetch(`/api/airspace/${encodeURIComponent(facility)}`);
        if (!r.ok) return null;
        const data = await r.json();
        airspaceCache[facility] = { data, fetchedAt: Date.now() };
        return data;
    } catch { return null; }
}

function ensureSplitMap() {
    if (splitMap) return;
    splitMap = L.map('splitMap', { zoomControl: true, attributionControl: false })
        .setView([39, -98], 5);
    splitMapLayer = L.layerGroup().addTo(splitMap);
}

async function renderSplitMap(facility) {
    const meta = document.getElementById('splitMapMeta');
    const legend = document.getElementById('splitLegend');
    if (!facility || !meta || !legend) return;

    ensureSplitMap();
    splitMapLayer.clearLayers();

    const [kmlAll, airspace] = await Promise.all([
        loadKmlSectors(),
        fetchAirspace(facility),
    ]);

    const sectors = kmlAll.filter(s =>
        s.artcc === facility && SPLIT_MAP_CATS.includes(s.category));
    if (!sectors.length) {
        meta.textContent = 'no KML boundaries for this facility';
        legend.innerHTML = '<span class="split-no-data">No sector geometry loaded (AllSectors.kml)</span>';
        return;
    }

    const groupMap = airspace?.sectorToGroup || {};
    const positions = airspace?.positions || [];
    const hasSplits = Object.keys(groupMap).length > 0;

    if (!hasSplits) {
        meta.textContent = 'no AIXM assignment data yet';
        for (const sec of sectors) {
            L.polygon(closeRing(sec.coords), {
                color: '#555', weight: 1, fillColor: '#222', fillOpacity: 0.4,
            }).bindTooltip(sec.sectorId).addTo(splitMapLayer);
        }
        legend.innerHTML = '<span class="split-no-data">Showing sector outlines only — split assignments appear when AIXM data is received.</span>';
    } else {
        const ageMin = airspace.updatedAt
            ? Math.round((Date.now() - new Date(airspace.updatedAt).getTime()) / 60000)
            : null;
        meta.textContent = `${positions.length} controller position(s)` +
            (ageMin != null ? ` · updated ${ageMin < 120 ? ageMin + 'm' : Math.round(ageMin / 60) + 'h'} ago` : '');

        for (const sec of sectors) {
            const primary = groupMap[sec.sectorId];
            const fill = primary ? colorForPrimary(primary) : '#333333';
            const fillOpacity = primary ? 0.62 : 0.15;
            L.polygon(closeRing(sec.coords), {
                color: primary ? fill : '#666',
                weight: primary ? 1.5 : 1,
                fillColor: fill,
                fillOpacity,
            }).bindTooltip(primary ? `${sec.sectorId} → ${primary}` : sec.sectorId)
              .addTo(splitMapLayer);
        }

        // Primary-sector labels at group centroids
        for (const pos of positions) {
            const polys = pos.controlledSectors
                .map(id => sectors.find(s => s.sectorId === id))
                .filter(Boolean);
            if (!polys.length) continue;
            const allPts = polys.flatMap(p => p.coords);
            const c = ringCentroid(allPts);
            L.marker(c, {
                icon: L.divIcon({ className: 'split-label', html: pos.primarySector, iconSize: [0, 0] }),
                interactive: false,
            }).addTo(splitMapLayer);
        }

        legend.innerHTML = positions.map(pos => {
            const col = colorForPrimary(pos.primarySector);
            const secs = pos.controlledSectors.join(', ');
            return `<div class="leg-item">
                <span class="swatch" style="background:${col}"></span>
                <span class="leg-primary">${pos.primarySector}</span>
                <span class="leg-secs">${secs}</span>
            </div>`;
        }).join('');
    }

    const bounds = L.latLngBounds(sectors.flatMap(s => s.coords));
    if (bounds.isValid()) splitMap.fitBounds(bounds, { padding: [16, 16] });
    setTimeout(() => splitMap.invalidateSize(), 50);
}

async function loadTransitions() {
    if (!selected || !selectedSector) return;
    try {
        const r = await fetch(`/api/sectors/${encodeURIComponent(selected)}/${encodeURIComponent(selectedSector)}/transitions`);
        transitionsCache = await r.json();
        renderTransitionPanel();
    } catch {}
}

function renderTransitionPanel() {
    const el = document.getElementById("transPanel");
    if (!el || !selectedSector) return;
    if (!transitionsCache) {
        el.innerHTML = `<h3>${selected}/${selectedSector} <small>loading transitions…</small></h3>`;
        return;
    }
    const t = transitionsCache;
    const max = Math.max(1, ...t.into.map(x=>x.count), ...t.outOf.map(x=>x.count));
    const row = (kind, x) => `<div class="trans-row ${kind}">
        <span class="who">${x.facility}/${x.sector}</span>
        <span class="bar"><i style="width:${(x.count/max*100).toFixed(0)}%"></i></span>
        <span class="cnt">${x.count}</span>
    </div>`;
    el.innerHTML = `
        <h3>${selected}/${selectedSector} <small>handoff history since server start</small></h3>
        <div class="trans-cols">
            <div class="trans-col">
                <div class="title in">↘ FROM (top 12)</div>
                ${t.into.length ? t.into.map(x => row('in', x)).join("") : '<div style="color:var(--dim);font-size:11px;">No data yet</div>'}
            </div>
            <div class="trans-col">
                <div class="title out">↗ TO (top 12)</div>
                ${t.outOf.length ? t.outOf.map(x => row('out', x)).join("") : '<div style="color:var(--dim);font-size:11px;">No data yet</div>'}
            </div>
        </div>`;
}

filter.addEventListener("input", renderList);
if (rangeSel) rangeSel.addEventListener("change", () => {
    rangeMin = parseInt(rangeSel.value, 10);
    const url = new URL(location.href);
    if (rangeMin !== 60) url.searchParams.set("range", String(rangeMin));
    else url.searchParams.delete("range");
    history.replaceState(null, "", url);
    refresh();
});
refresh();
if (selected && selectedSector) loadTransitions();
setInterval(refresh, 5000);
setInterval(() => { if (selected) renderSplitMap(selected); }, 60000);
// Refresh transitions slower since counts only change on handoffs.
setInterval(() => { if (selected && selectedSector) loadTransitions(); }, 30000);
</script>
</body>
</html>
