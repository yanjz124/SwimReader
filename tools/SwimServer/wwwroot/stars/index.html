<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>STARS - Facility Selector</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📡</text></svg>">
<style>
  body {
    margin: 0;
    background: #000;
    color: #cccc44;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header h1 .wip {
    font-size: 10px; letter-spacing: 1px; color: #ffb300;
    border: 1px solid #5a4300; background: #1a1400; border-radius: 2px;
    padding: 1px 5px; vertical-align: middle; margin-left: 8px;
  }
  .subhead { padding: 6px 20px 8px; border-bottom: 1px solid #3a3a14; }
  .subhead .sub { color: #b8b884; font-size: 11px; }
  .subhead .wipnote { color: #ffb300; font-size: 11px; margin-top: 4px; }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    flex: 1; min-height: 0;
  }
  .col { overflow-y: auto; border-right: 1px solid #3a3a14; }
  .col:last-child { border-right: none; }
  .col h2 {
    margin: 0;
    padding: 8px 16px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #b8b884;
    border-bottom: 1px solid #3a3a14;
    background: #050505;
    position: sticky;
    top: 0;
  }
  .row {
    padding: 6px 16px;
    border-bottom: 1px solid #1a1a08;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
  }
  .row:hover { background: #1a1a05; }
  .row:hover + .fac-tcps { background: #1a1a05; }
  .row.active { background: #3a3a0a; color: #fff; }
  .row .id { color: #cccc44; font-weight: bold; }
  .row .meta { color: #a8a874; font-size: 11px; }
  .row .subtext { color: #666; font-size: 10px; }
  #artccs .row { flex-direction: row; align-items: center; gap: 0; }
  #artccs .row-header { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  #artccs .row .meta { margin-left: auto; }
  #artccs .row .id { display: block; }
  #artccs .row .subtext { display: block; }
  .row .caret { display: inline-block; width: 12px; color: #b8b884; }
  .row.area { padding-left: 34px; background: #050505; }
  .row.area:hover { background: #0d0d03; }
  .row.area .id { color: #a8a874; font-weight: normal; }
  .row.area .meta { color: #685; }
  .areas { border-bottom: 1px solid #1a1a08; }
  .placeholder { padding: 16px; color: #888835; }
  .nostars { color: #888; font-style: italic; padding: 16px; }
  /* Shown when the scope route sent us back here — a facility with no STARS configuration, or
     an id this ARTCC doesn't have. The scope used to render blank in both cases. */
  .notice { display: none; margin: 0 20px 12px; padding: 10px 12px; font-size: 12px;
            color: #cccc44; background: #2a2a12; border: 1px solid #6b6b22; border-radius: 3px; }
  .notice.on { display: block; }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #444;
    border-top-color: #cccc44;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fac-tcps { padding: 0 16px 7px 30px; display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #1a1a08; }
  .fac-tcps .tcp-chip {
    font-size: 10px; color: #a8a874;
    background: #0c0c00; border: 1px solid #3a3a14; border-radius: 2px;
    padding: 0 5px; line-height: 1.6;
    margin-top: 4px;
  }
  .fac-tcps .tcp-chip b { color: #cccc44; font-weight: normal; margin-left: 3px; }
  .fac-tcps .tcp-chip { cursor: pointer; }
  .fac-tcps .tcp-chip:hover { background: #26260a; border-color: #cccc44; color: #e8e8c0; }

  /* LIVE / REPLAY launch mode. Replay opens the facility's recorded terminal data instead of the
     live feed — the scope itself is unchanged either way, it just gets a different source. */
  .modes { display: inline-flex; border: 1px solid #3a3a14; border-radius: 2px; overflow: hidden; margin-left: 12px; vertical-align: middle; }
  .modes button {
    background: #050505; color: #b8b884; border: 0; border-right: 1px solid #3a3a14;
    font: inherit; font-size: 11px; letter-spacing: 1px; padding: 2px 10px; cursor: pointer;
  }
  .modes button:last-child { border-right: 0; }
  .modes button.on { background: #3a3a0a; color: #fff; }
  .modes button.on.replay { background: #3a2a00; color: #ffb300; }
  .row.norec { opacity: .45; cursor: not-allowed; }
  .row .rec { color: #ffb300; font-size: 10px; }
</style>
<link rel="stylesheet" href="/shared/common.css">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header>
  <h1>STARS</h1>
  <span class="sub" style="margin-left:16px; color:#666; font-size:11px; transform:translateY(1px);">Standard Terminal Automation Replacement System</span>
</header>
<div class="subhead">
  <div class="sub">Pick an ARTCC, then pick a facility with a STARS configuration. Profile data sourced from vNAS.
    <span class="modes" id="modes">
      <button id="mode-live" class="on" title="Open the facility on the live terminal feed">LIVE</button>
      <button id="mode-replay" class="replay" title="Open the facility on its recorded terminal data, with a scrub bar">REPLAY</button>
    </span>
  </div>
</div>
<div class="notice" id="notice"></div>
<div class="layout">
  <div class="col">
    <h2>ARTCC</h2>
    <div id="artccs"><div class="placeholder">Loading…</div></div>
  </div>
  <div class="col">
    <h2>FACILITY</h2>
    <div id="facilities"><div class="placeholder">Select an ARTCC</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const ARTCC_NAMES = {
  ZAB: 'Albuquerque', ZAG: 'Atlanta', ZAN: 'Anchorage', ZAU: 'Chicago', ZBW: 'Boston',
  ZDC: 'Washington', ZDV: 'Denver', ZEG: 'Edmonton', ZFW: 'Fort Worth', ZHN: 'Honolulu', ZHU: 'Houston', ZID: 'Indianapolis',
  ZJX: 'Jacksonville', ZKC: 'Kansas City', ZLA: 'Los Angeles', ZLC: 'Salt Lake City',
  ZMA: 'Miami', ZME: 'Memphis', ZMP: 'Minneapolis', ZNY: 'New York', ZOA: 'Oakland', ZOB: 'Cleveland',
  ZQM: '', ZSE: 'Seattle', ZSU: 'San Juan', ZTL: 'Atlanta', ZUA: 'Agana', ZUL: 'Montreal', ZVR: 'Vancouver', ZWG: 'Winnipeg', ZYZ: 'Toronto', ZZZ: ''
};

let selectedArtcc = null;

// ── Launch mode ────────────────────────────────────────────────────────────
// LIVE opens the facility on the live terminal feed; REPLAY opens the same scope pointed at that
// facility's recorded TAIS data (?replay=1), where the shared replay bar takes over. Which
// facilities have a recording comes from /api/replay/range, so REPLAY can gray out the ones with
// nothing to play rather than opening a scope that sits empty.
let replayMode = false;
let taisRanges = {};         // facility → { start, end }
const LIVE_NOTE = "Pick an ARTCC, then pick a facility with a STARS configuration. Profile data sourced from vNAS.";

function setMode(replay) {
  replayMode = replay;
  $("mode-live").classList.toggle("on", !replay);
  $("mode-replay").classList.toggle("on", replay);
  $("wipnote").textContent = replay
    ? "REPLAY — picking a facility opens its recorded terminal data with a scrub bar. Facilities with no recording are grayed out."
    : LIVE_NOTE;
  if (selectedArtcc) selectArtcc(selectedArtcc);   // re-render rows for the new mode
}
$("mode-live").onclick = () => setMode(false);
$("mode-replay").onclick = () => setMode(true);

async function loadTaisRanges() {
  try {
    const r = await fetch("/api/replay/range").then(x => x.json());
    taisRanges = r.tais || {};
  } catch { taisRanges = {}; }
}
const fmtRange = (r) => {
  if (!r || !r.start || !r.end) return "";
  const t = (iso) => new Date(iso).toISOString().slice(5, 16).replace("T", " ") + "Z";
  return `${t(r.start)} → ${t(r.end)}`;
};

async function loadArtccs() {
  try {
    const ids = await fetch("/api/stars/artccs").then(r => r.json());
    $("artccs").innerHTML = ids.map(id =>
      `<div class="row" data-id="${id}">
        <div class="row-header">
          <span class="id">${id}</span>
          <span class="subtext">${ARTCC_NAMES[id] || ''}</span>
        </div>
      </div>`).join("");
    for (const el of document.querySelectorAll("#artccs .row"))
      el.onclick = () => selectArtcc(el.dataset.id);
  } catch (e) {
    $("artccs").innerHTML = `<div class="placeholder">Error: ${e}</div>`;
  }
}

async function selectArtcc(id) {
  selectedArtcc = id;
  for (const el of document.querySelectorAll("#artccs .row"))
    el.classList.toggle("active", el.dataset.id === id);
  $("facilities").innerHTML = `<div class="placeholder"><span class="spinner"></span>Loading ${id}… (This may take a few seconds)</div>`;
  try {
    const data = await fetch(`/api/stars/artcc/${encodeURIComponent(id)}`).then(r => r.json());
    if (!data.facilities || data.facilities.length === 0) {
      $("facilities").innerHTML = `<div class="nostars">No STARS-configured facilities in ${id}.</div>`;
      return;
    }
    // Video maps come from vNAS's public file store, fetched on demand and cached server-side,
    // so the count is what the ARTCC publishes rather than what happens to be on disk.
    const avail = await fetch(`/api/stars/videoMaps/${encodeURIComponent(id)}`).then(r => r.json()).catch(() => ({available:[]}));
    const cachedNote = avail.source === "vnas" ? ` (${avail.cached} cached)` : "";
    const mapsBanner = avail.available.length
      ? `<div style="padding:8px 16px;background:#0a2a0a;border-bottom:1px solid #1a3a1a;color:#6f6;font-size:11px;">${avail.available.length} video maps for ${id}${cachedNote}</div>`
      : `<div style="padding:8px 16px;background:#2a1a0a;border-bottom:1px solid #3a2a1a;color:#fb6;font-size:11px;">No video maps for ${id} — targets will still display.</div>`;
    // Live per-facility track counts from TAIS — same STDDS source as the scope feed.
    //
    // Keyed on `feedFacilityId`, NOT `f.id`. The two agree almost everywhere, which is exactly why
    // this was wrong for a year and only broke one facility: vNAS adaptation calls Palm Beach
    // TRACON PBI while TAIS publishes it as DJT (the airport was renamed), so `taisCounts["PBI"]`
    // was undefined and a TRACON working 170 tracks with 7 positions staffed showed neither —
    // it read as a dead facility. The scope itself always resolved this (scope.js feedId()); only
    // the picker didn't. Best-effort; facilities with no TAIS feed just show no count.
    const taisCounts = {};
    try {
      for (const t of await fetch("/api/tais").then(r => r.json())) taisCounts[t.facility] = t.trackCount;
    } catch {}
    // Live active controller positions (TCPs owning tracks) per facility.
    const tcpByFac = {};
    try {
      for (const t of await fetch("/api/tais/tcps").then(r => r.json())) tcpByFac[t.facility] = t;
    } catch {}
    const facilityRows = data.facilities.map(f => {
      const areas = Array.isArray(f.areas) ? f.areas.filter(a => a && a.id) : [];
      const multi = areas.length > 1;
      // Everything live or recorded is keyed by the feed id (see above).
      const feedId = f.feedFacilityId || f.id;
      const cnt = taisCounts[feedId];
      const cntStr = (cnt != null) ? ` · ${cnt}T` : "";
      const tcp = tcpByFac[feedId];
      const posStr = (tcp && tcp.tcpCount) ? ` · ${tcp.tcpCount} pos` : "";
      const caret = multi ? `<span class="caret">▸</span>` : `<span class="caret"></span>`;
      // In REPLAY mode the row advertises what's on tape instead of what's live, and a facility with
      // no recording is disabled rather than opening a scope that would just sit empty.
      const rec = taisRanges[feedId];
      const norec = replayMode && !rec;
      const meta = replayMode
        ? (rec ? `<span class="rec">${fmtRange(rec)}</span>` : "no recording")
        : `${f.name || ""} · ${f.videoMapCount || 0} maps · ${areas.length} area${areas.length === 1 ? "" : "s"}${cntStr}${posStr}`;
      const head =
        `<div class="row fac${norec ? " norec" : ""}" data-id="${f.id}" data-multi="${multi ? 1 : 0}" data-norec="${norec ? 1 : 0}">
          <span class="id">${caret}${f.id}</span>
          <span class="meta">${meta}</span>
        </div>`;
      // The chips are the staffed positions, and clicking one signs the scope on to it.
      // That is not just a convenience: a facility's DCB map buttons belong to the POSITION
      // (vNAS publishes one mapGroup per group of TCPs — PCT has 15, SCT 33, NCT 39), so
      // opening a facility cold binds whichever group vNAS listed first and the inline MAP
      // buttons are somebody else's. Launching with ?tcp= lands on the right layout, and the
      // scope re-binds if you later sign on elsewhere with `.SO`.
      const tcpLine = (tcp && tcp.tcps.length)
        ? `<div class="fac-tcps">${tcp.tcps.map(t =>
            `<span class="tcp-chip" data-fac="${f.id}" data-tcp="${t.tcp}" title="Open ${f.id} signed on as ${t.tcp} — uses this position's DCB map buttons">${t.tcp}<b>${t.count}</b></span>`
          ).join("")}</div>`
        : "";
      const sub = multi
        ? `<div class="areas" data-for="${f.id}" hidden>` +
            areas.map(a =>
              `<div class="row area" data-fac="${f.id}" data-area="${a.id}">
                <span class="id">${a.name || a.id}</span>
              </div>`).join("") +
          `</div>`
        : "";
      return head + tcpLine + sub;
    }).join("");
    $("facilities").innerHTML = mapsBanner + facilityRows;
    // Profile picker: if any DGScope profile XMLs exist for this ARTCC, show
    // them. Clicking a profile launches the scope with ?profile=... applied.
    let profiles = [];
    try {
      profiles = (await fetch(`/api/stars/profiles/${encodeURIComponent(id)}`).then(r => r.json())).profiles || [];
    } catch {}
    if (profiles.length > 0) {
      const profileSection = `<div style="padding:6px 16px;color:#888;font-size:11px;border-top:1px solid #1a3a1a;">DGScope PROFILES (loads PrefSet + DCBMapList)</div>` +
        profiles.map(p => `<div class="row" data-profile="${p}">
          <span class="id" style="color:#6cf">${p}</span>
        </div>`).join("");
      $("facilities").innerHTML += profileSection;
      for (const el of document.querySelectorAll("#facilities .row[data-profile]")) {
        el.onclick = () => {
          // Find the facility ID from the profile name prefix: "{FACILITY}_..."
          const pname = el.dataset.profile;
          const facId = (data.facilities.find(f => pname.startsWith(f.id + "_")) || data.facilities[0]).id;
          location.href = `/stars/${encodeURIComponent(id)}/${encodeURIComponent(facId)}?profile=${encodeURIComponent(pname)}`
            + (replayMode ? "&replay=1" : "");   // a profile is a display config — it applies to replay too
        };
      }
    }
    const launch = (facId, areaId, tcp) => {
      const q = [];
      if (areaId) q.push(`area=${encodeURIComponent(areaId)}`);
      if (tcp) q.push(`tcp=${encodeURIComponent(tcp)}`);
      if (replayMode) q.push("replay=1");
      location.href = `/stars/${encodeURIComponent(id)}/${encodeURIComponent(facId)}`
        + (q.length ? `?${q.join("&")}` : "");
    };
    // Position chip → open signed on to that TCP, which also binds its DCB map group.
    for (const el of document.querySelectorAll("#facilities .tcp-chip")) {
      el.onclick = (e) => { e.stopPropagation(); launch(el.dataset.fac, null, el.dataset.tcp); };
    }
    // Facility row: multi-area facilities expand their area submenu; single/no
    // area launches straight into the scope.
    for (const el of document.querySelectorAll("#facilities .row.fac")) {
      el.onclick = () => {
        const facId = el.dataset.id;
        if (el.dataset.norec === "1") return;   // nothing recorded for this facility
        if (el.dataset.multi === "1") {
          const sub = document.querySelector(`#facilities .areas[data-for="${CSS.escape(facId)}"]`);
          const caret = el.querySelector(".caret");
          if (sub) { sub.hidden = !sub.hidden; if (caret) caret.textContent = sub.hidden ? "▸" : "▾"; }
        } else {
          launch(facId);
        }
      };
    }
    for (const el of document.querySelectorAll("#facilities .row.area"))
      el.onclick = () => launch(el.dataset.fac, el.dataset.area);
  } catch (e) {
    $("facilities").innerHTML = `<div class="placeholder">Error: ${e}</div>`;
  }
}

// The scope route redirects here with ?notice= when a facility can't be displayed (no STARS
// configuration, or an id this ARTCC doesn't have) instead of drawing a blank scope.
// textContent, never innerHTML — this string comes straight off the query string.
(function showNotice() {
  const msg = new URLSearchParams(location.search).get("notice");
  if (!msg) return;
  const el = $("notice");
  el.textContent = msg;
  el.classList.add("on");
})();

loadTaisRanges().then(loadArtccs);
</script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
