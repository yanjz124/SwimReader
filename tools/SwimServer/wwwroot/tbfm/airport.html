<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBFM Arrival Metering</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⏱</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tbfm/tbfm.css?v=1">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body class="has-up">
<header>
    <a class="nav-home" href="/">&larr; HOME</a>
    <h1 id="title">TBFM</h1>
    <span class="header-label" id="aptname"></span>
    <span id="status">connecting…</span>
</header>

<div class="strip" id="strip"></div>
<div class="sub" id="info"></div>

<div class="filterbar">
    <label for="q">FILTER</label>
    <input type="text" id="q" placeholder="callsign, point, center, gate…" autocomplete="off">
    <label><input type="checkbox" id="onlydly"> held only</label>
    <label><input type="checkbox" id="onlyrwy"> runway schedule only</label>
    <span class="count" id="count"></span>
</div>

<div class="tablewrap">
    <table class="rows" id="tbl">
        <thead><tr id="hdr"></tr></thead>
        <tbody id="body"><tr><td class="empty" colspan="14">Loading…</td></tr></tbody>
    </table>
</div>

<div class="note" id="note"></div>

<script src="/shared/airport-names.js?v=2"></script>
<script src="/tbfm/airport.js?v=2"></script>
<script src="/idle-timer.js?v=3"></script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
