<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDLS - Facility Selector</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📨</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=3">
<link rel="stylesheet" href="/tdls/directory.css?v=4">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TDLS CLEARANCE DIRECTORY</h1>
    <div class="hdr-right">
        <div class="mode-toggle" id="modeToggle">
            <button type="button" data-mode="live">LIVE</button>
            <button type="button" data-mode="history">HISTORY</button>
        </div>
        <select id="dateSel" hidden></select>
        <div id="status">loading...</div>
    </div>
</header>
<div class="hist-search" id="histSearch" hidden>
    <input type="text" id="csInput" placeholder="Find a callsign on this day (e.g. DAL123)" spellcheck="false" autocomplete="off">
    <div id="csResults"></div>
</div>
<div id="count-bar"></div>
<div id="grid"><div class="empty">Loading airports...</div></div>

<script src="/tdls/directory.js?v=4"></script>
<script src="/idle-timer.js?v=3"></script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
