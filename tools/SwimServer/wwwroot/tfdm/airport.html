<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFDM Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🛫</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/shared/frame.css?v=4">
<link rel="stylesheet" href="/tfdm/airport.css?v=2">
</head>
<body>
<header>
    <div class="header-left">
        <a class="nav-home" href="/">&larr; HOME</a>
    </div>
    <h1 id="apt">TFDM</h1>
    <span class="header-label">Terminal Flight Data Manager</span>
    <div class="status-bar">
        <span id="aptName"></span>
    </div>
</header>
<div class="infobar" id="infobar"></div>
<div class="tmis" id="tmis" style="display:none"></div>
<div class="filters">
  <button data-f="dep" class="on">DEPARTURES</button>
  <button data-f="arr">ARRIVALS</button>
  <button data-f="all">ALL</button>
  <input id="q" placeholder="filter — ual*, *dfw, a*23">
  <span class="status"><span class="dot" id="dot"></span> <span id="cnt">–</span></span>
</div>
<div class="wrap"><table>
  <thead><tr id="head"></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<div id="empty" class="empty" style="display:none">No flights.</div>

<script>
const AP = location.pathname.split('/').pop().toUpperCase();
document.getElementById('apt').textContent = AP;
const NAMES = {KLAS:"Las Vegas",KMDW:"Chicago Midway",KTEB:"Teterboro",KMIA:"Miami",KSEA:"Seattle",KIAD:"Washington Dulles",KOAK:"Oakland",KLGA:"New York LaGuardia",KDFW:"Dallas-Ft Worth",KATL:"Atlanta",KBNA:"Nashville",KBOI:"Boise",KCLE:"Cleveland",KDAL:"Dallas Love Field",KDAY:"Dayton",KHOU:"Houston Hobby",KHPN:"Westchester",KIND:"Indianapolis",KPHL:"Philadelphia",KRDU:"Raleigh-Durham",KSDF:"Louisville",KSJC:"San Jose",KTPA:"Tampa"};
document.getElementById('aptName').textContent = NAMES[AP]||'';

let DATA = { flights:[], info:null, tmis:[] };
let mode = 'dep';

function fmtT(iso){ if(!iso) return '·'; try { return new Date(iso).toISOString().slice(11,16)+'Z'; } catch { return '·'; } }
function fmtDur(d){ // ISO8601 duration PT#H#M -> minutes
  if(!d) return '·';
  const m = /P(?:T)?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d); if(!m) return d;
  const min = (+(m[1]||0))*60 + (+(m[2]||0)) + Math.round((+(m[3]||0))/60);
  return min+'m';
}
function delayMin(d){ if(!d) return null; const m=/P(?:T)?(?:(\d+)H)?(?:(\d+)M)?/.exec(d); if(!m) return null; return (+(m[1]||0))*60+(+(m[2]||0)); }
function durNum(d){ if(!d) return 1e12; const m=/P(?:T)?(?:(\d+)H)?(?:(\d+)M)?/.exec(d); if(!m) return 1e12; return (+(m[1]||0))*60+(+(m[2]||0)); }
function numOr(v,d){ const n=parseInt(v,10); return isNaN(n)?d:n; }
function tms(iso){ if(!iso) return Infinity; const t=Date.parse(iso); return isNaN(t)?Infinity:t; }  // epoch for time sort
function rwy(f){ return f.rwyActual||f.rwyAssigned||f.rwyPredicted||''; }
// Filter match with * wildcards: "ual*" prefix, "*23" suffix, "*al*" contains,
// "u*23" middle. No * = plain contains (back-compatible). All uppercase.
function wildMatch(pattern, val){
  val = (val||'').toUpperCase();
  if(!pattern.includes('*')) return val.includes(pattern);
  const rx = new RegExp('^' + pattern.split('*').map(s=>s.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*') + '$');
  return rx.test(val);
}
function state(f){
  if(f.runwayEntry) return {c:'active',t:'DEP'};        // entered the runway → departed
  if(f.elapsedTaxi || f.rwyActual) return {c:'active',t:'OUT'};
  if(f.offBlock && new Date(f.offBlock) > new Date()) return {c:'sched',t:'SCHED'};
  return {c:'pend',t:'READY'};
}
function esc2(s){ return (s==null?'':String(s)).replace(/"/g,'&quot;'); }
const esc = s => (s==null?'·':String(s));
// Each column: header, sort accessor (+type), and the <td> cell renderer.
const COLS_DEP = [
  {h:'SEQ',      t:'n', k:f=>numOr(f.depSeq,1e12),        td:f=>`<td class="seq">${esc(f.depSeq)}</td>`},
  {h:'CALLSIGN', t:'s', k:f=>f.callsign||'',              td:f=>`<td class="cs">${esc(f.callsign)}</td>`},
  {h:'→ DEST',   t:'s', k:f=>f.dest||'',                  td:f=>`<td class="rwy">${esc(f.dest)}</td>`},
  {h:'SPOT',     t:'s', k:f=>f.spot||'',                  td:f=>`<td class="spot">${esc(f.spot)}</td>`},
  {h:'RWY',      t:'s', k:f=>rwy(f),                       td:f=>`<td class="rwy">${rwy(f)||'·'}</td>`},
  {h:'OBT Z',    t:'n', k:f=>tms(f.offBlock),              td:f=>`<td class="t">${fmtT(f.offBlock)}</td>`},
  {h:'TSAT Z',   t:'n', k:f=>tms(f.estDeparture),          td:f=>`<td class="tsat">${fmtT(f.estDeparture)}</td>`},
  {h:'TAXI',     t:'n', k:f=>durNum(f.taxiOutEst),         td:f=>`<td class="muted">${fmtDur(f.taxiOutEst)}</td>`},
  {h:'DELAY',    t:'n', k:f=>{const d=delayMin(f.reportableDelay)??delayMin(f.delay);return d==null?-1:d;}, td:f=>{
      const rd=delayMin(f.reportableDelay), d=rd!=null?rd:delayMin(f.delay);
      const title=f.delayReason?` title="${esc2(f.delayReason)}${f.delayChargeTo?' · charge '+f.delayChargeTo:''}"`:'';
      return `<td class="delay ${d>0?'pos':''}"${title}>${d!=null?(d>0?'+'+d:d):'·'}${rd!=null?'*':''}</td>`;}},
  {h:'STATE',    t:'s', k:f=>state(f).t,                   td:f=>{const s=state(f);return `<td><span class="chip ${s.c}">${s.t}</span>${f.apreqRelease?'<span class="chip apreq">APREQ</span>':''}</td>`;}},
];
const COLS_ARR = [
  {h:'CALLSIGN', t:'s', k:f=>f.callsign||'', td:f=>`<td class="cs">${esc(f.callsign)}</td>`},
  {h:'FROM',     t:'s', k:f=>f.origin||'',   td:f=>`<td class="muted">${esc(f.origin)}</td>`},
  {h:'RWY',      t:'s', k:f=>rwy(f),          td:f=>`<td class="rwy">${rwy(f)||'·'}</td>`},
  {h:'ETA Z',    t:'n', k:f=>tms(f.arrivalEst), td:f=>`<td class="t">${fmtT(f.arrivalEst)}</td>`},
  {h:'SPOT',     t:'s', k:f=>f.spot||'',      td:f=>`<td class="spot">${esc(f.spot)}</td>`},
  {h:'STATE',    t:'s', k:f=>state(f).t,      td:f=>{const s=state(f);return `<td><span class="chip ${s.c}">${s.t}</span></td>`;}},
];
// sort state per mode; defaults: DEP→TSAT asc (idx6), ARR→ETA asc (idx3)
const SORT = { dep:{i:6,dir:1}, arr:{i:3,dir:1} };

function render(){
  const info = DATA.info;
  const ib = document.getElementById('infobar'); ib.innerHTML='';
  if(info){
    const parts=[];
    if(info.config) parts.push(`<span class="k">Config</span> <span class="v">${info.config.replace(/_/g,' ')}</span>`);
    if(info.aar||info.adr) parts.push(`<span class="k">AAR / ADR</span> <span class="v">${info.aar||'–'} / ${info.adr||'–'}</span>`);
    if(info.closedRunways&&info.closedRunways.length) parts.push(`<span class="k">Closed</span> <span class="gl-bad">${info.closedRunways.join(' ')}</span>`);
    if(info.gridlock) parts.push(`<span class="k">Gridlock</span> <span class="${info.gridlock.includes('NO')?'v':'gl-bad'}">${info.gridlock.replace(/_/g,' ')}</span>`);
    if(info.airportQueue!=null) parts.push(`<span class="k">Dep queue</span> <span class="qs">${info.airportQueue}</span>`);
    if(info.departureDelay) parts.push(`<span class="k">Dep delay</span> <span class="warn">${info.departureDelay}</span>`);
    if(info.runwayQueues) parts.push('<span class="k">Rwy Q</span> <span class="v">'+Object.entries(info.runwayQueues).filter(([k,v])=>v>0).map(([k,v])=>`${k}:${v}`).join(' ')||'—'+'</span>');
    if(info.demand&&info.demand[0]) parts.push(`<span class="k">Demand ${(info.demand[0].start||'').slice(11,16)}</span> <span class="v">${info.demand[0].dep||0} dep / ${info.demand[0].arr||0} arr</span>`);
    ib.innerHTML = parts.join('');
  }
  const td = document.getElementById('tmis');
  if(DATA.tmis&&DATA.tmis.length){ td.style.display='block';
    td.innerHTML='<span class="k" style="color:#888">TMIs:</span> '+DATA.tmis.map(t=>
      `<span class="tmi ${t.status==='ACTIVE'?'':'susp'}">${t.type||''} ${t.controlledElement||t.name||''}${t.restriction?' '+t.restriction:''}${t.minutesInTrail&&t.minutesInTrail!=='0'?' '+t.minutesInTrail+'MIT':''} <span style="opacity:.6">${t.status||''}</span></span>`).join(' ');
  } else td.style.display='none';

  const q = document.getElementById('q').value.trim().toUpperCase();
  let list = DATA.flights.filter(f=>{
    if(mode==='dep' && f.origin!==AP) return false;
    if(mode==='arr' && f.dest!==AP) return false;
    if(q && !(wildMatch(q, f.callsign) || wildMatch(q, f.dest) || wildMatch(q, f.origin))) return false;
    return true;
  });
  const cols = mode==='arr' ? COLS_ARR : COLS_DEP;
  const st = SORT[mode];
  // clickable headers with a ▲/▼ indicator on the active column
  document.getElementById('head').innerHTML = cols.map((c,i)=>
    `<th data-i="${i}" style="cursor:pointer;user-select:none">${c.h}${i===st.i?(st.dir>0?' ▲':' ▼'):''}</th>`).join('');
  document.querySelectorAll('#head th').forEach(th=>th.onclick=()=>{
    const i=+th.dataset.i;
    if(st.i===i) st.dir=-st.dir; else { st.i=i; st.dir=1; }
    render();
  });

  const rows = document.getElementById('rows');
  document.getElementById('cnt').textContent = list.length+' flights';
  if(!list.length){ rows.innerHTML=''; document.getElementById('empty').style.display=''; return; }
  document.getElementById('empty').style.display='none';

  const col = cols[st.i];
  list.sort((a,b)=>{
    const ka=col.k(a), kb=col.k(b);
    const cmp = col.t==='n' ? (ka-kb) : String(ka).localeCompare(String(kb));
    return cmp*st.dir;
  });
  rows.innerHTML = list.map(f=>`<tr>${cols.map(c=>c.td(f)).join('')}</tr>`).join('');
}

document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.f; document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
document.getElementById('q').addEventListener('input', render);

let ws;
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/tfdm/ws/'+AP);
  ws.onopen=()=>document.getElementById('dot').classList.add('live');
  ws.onclose=()=>{ document.getElementById('dot').classList.remove('live'); setTimeout(connect,5000); };
  ws.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.type==='snapshot'){ DATA=m.data; render(); } }catch(x){} };
}
connect();
</script>
<script src="/idle-timer.js?v=3"></script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
