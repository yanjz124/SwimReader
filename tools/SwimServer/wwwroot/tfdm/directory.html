<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFDM — Terminal Departure Boards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🛫</text></svg>">
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/shared/frame.css?v=4">
<link rel="stylesheet" href="/tfdm/directory.css?v=1">
</head>
<body>
<header>
    <div class="header-left">
        <a class="nav-home" href="/">&larr; HOME</a>
    </div>
    <h1>TFDM</h1>
    <span class="header-label">Terminal Flight Data Manager</span>
    <div class="status-bar">
        <span id="updated">--</span>
    </div>
</header>
<div class="sub">Airports with live TFDM surface data. Click one for its departure board (off-block / TSAT / runway / taxi).</div>
<div id="grid" class="grid"><div class="empty">Loading…</div></div>

<script>
const NAMES = {KATL:"Atlanta",KLAX:"Los Angeles",KORD:"Chicago O'Hare",KDFW:"Dallas-Ft Worth",KDEN:"Denver",
 KJFK:"New York JFK",KLGA:"New York LaGuardia",KEWR:"Newark",KLAS:"Las Vegas",KMCO:"Orlando",KMIA:"Miami",
 KCLT:"Charlotte",KSEA:"Seattle",KPHX:"Phoenix",KIAH:"Houston",KSFO:"San Francisco",KBOS:"Boston",
 KDTW:"Detroit",KMSP:"Minneapolis",KFLL:"Ft Lauderdale",KMDW:"Chicago Midway",KTEB:"Teterboro",
 KSAN:"San Diego",KIAD:"Washington Dulles",KDCA:"Washington National",KBWI:"Baltimore",KPDX:"Portland",
 KSLC:"Salt Lake City",KSAT:"San Antonio",KAUS:"Austin",KOAK:"Oakland",KCMH:"Columbus",KBNA:"Nashville",
 KBOI:"Boise",KCLE:"Cleveland",KDAL:"Dallas Love Field",KDAY:"Dayton",KHOU:"Houston Hobby",KHPN:"Westchester",
 KIND:"Indianapolis",KPHL:"Philadelphia",KRDU:"Raleigh-Durham",KSDF:"Louisville",KSJC:"San Jose",KTPA:"Tampa"};
async function load(){
  try {
    const r = await fetch('/api/tfdm'); const d = await r.json();
    d.sort((a,b)=>a.airport.localeCompare(b.airport));   // alphabetical
    const g = document.getElementById('grid');
    if(!d.length){ g.innerHTML='<div class="empty">No TFDM airports reporting yet.</div>'; return; }
    g.innerHTML = d.map(a=>`<a class="card" href="/tfdm/${a.airport.toLowerCase()}">
        <div class="icao">${a.airport}</div>
        <div class="name">${NAMES[a.airport]||''}</div>
        <div class="cnt"><b>${a.count}</b> flights</div></a>`).join('');
    document.getElementById('updated').textContent = new Date().toISOString().slice(11,19)+'Z';
  } catch(e){ document.getElementById('updated').textContent='error'; }
}
load(); setInterval(load, 5000);
</script>
<script src="/idle-timer.js?v=3"></script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
