<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM APTC — Airport Configurations | swim.vncrcc.org</title>
<link rel="stylesheet" href="/shared/common.css?v=3">
<link rel="stylesheet" href="/tfm/aptc.css?v=3">
<link rel="stylesheet" href="/shared/frame.css?v=2">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TFM APTC</h1>
    <span class="sub">Runway Configurations — current AAR/ADR per airport</span>
    <div class="status-bar">
        <span id="count">--</span>
        <span class="dot">•</span>
        <span id="updated">--</span>
        <span class="dot">•</span>
        <a class="home-link" href="/tfm/fido">fido</a>
        <span class="dot">•</span>
        <a class="home-link" href="/">home</a>
    </div>
</header>

<div class="filter-row">
    <input type="text" id="searchInput" placeholder="Filter (airport / facility / runway / weather)..." style="flex:1;min-width:280px;">
    <label>Weather</label>
    <select id="wxFilter"><option value="">ALL</option></select>
    <label>Facility</label>
    <select id="facFilter"><option value="">ALL</option></select>
</div>

<div class="table-wrap">
    <table class="ois-table">
        <thead>
            <tr>
                <th class="sortable" data-sort="airport" title="Click to sort">AIRPORT</th>
                <th>FAC</th>
                <th>WX</th>
                <th>ARR RWY</th>
                <th class="sortable num" data-sort="aar" title="Click to sort">AAR</th>
                <th class="sortable num" data-sort="aarStrat" title="Strategic AAR">STRAT</th>
                <th>DEP RWY</th>
                <th class="sortable num" data-sort="adr" title="Click to sort">ADR</th>
                <th class="sortable num" data-sort="combined" title="Click to sort">COMB</th>
                <th>UPDATED</th>
                <th class="sortable num" data-sort="age" title="Click to sort">AGE</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">Loading...</div>
</div>

<script src="/tfm/aptc.js?v=3"></script>
<script src="/shared/frame.js?v=1"></script>
</body>
</html>
