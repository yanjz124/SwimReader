<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM APTC — Airport Configurations | swim.vncrcc.org</title>
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tfm/aptc.css?v=1">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TFM APTC</h1>
    <span class="sub">Airport Configurations — current AAR/ADR, runway config, weather</span>
    <div class="status-bar">
        <span id="count">--</span>
        <span class="dot">•</span>
        <span id="updated">--</span>
        <span class="dot">•</span>
        <a class="home-link" href="/tfm/fido">fido</a>
        <span class="dot">•</span>
        <a class="home-link" href="/">home</a>
    </div>
</header>

<div class="filter-row">
    <input type="text" id="searchInput" placeholder="Filter (airport / facility / runway config / weather)..." style="flex:1;min-width:280px;">
    <label>Weather</label>
    <select id="wxFilter"><option value="">ALL</option></select>
    <label>Sort</label>
    <select id="sortBy">
        <option value="airport" selected>Airport</option>
        <option value="updated">Recently updated</option>
        <option value="aar">Highest AAR</option>
        <option value="adr">Highest ADR</option>
        <option value="combined">Combined rate</option>
    </select>
</div>

<div class="grid" id="grid"></div>

<div id="empty" class="empty">Loading...</div>

<script src="/tfm/aptc.js?v=1"></script>
</body>
</html>
