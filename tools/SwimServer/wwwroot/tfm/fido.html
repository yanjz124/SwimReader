<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM FIDO — R14 Flight Data | swim.vncrcc.org</title>
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tfm/fido.css?v=1">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TFM FIDO</h1>
    <span class="sub">R14 Flight Data — every flight in the TFMS feed</span>
    <div class="status-bar">
        <span id="count">--</span>
        <span class="dot">•</span>
        <span id="updated">--</span>
        <span class="dot">•</span>
        <a class="home-link" href="/tfm">tfm</a>
        <span class="dot">•</span>
        <a class="home-link" href="/">home</a>
    </div>
</header>

<div class="filter-row">
    <input type="text" id="searchInput" placeholder="Search (callsign / airline / cid / dep / arr / type / route / facility)..." style="flex:1;min-width:280px;">
    <label>Status</label>
    <select id="statusFilter">
        <option value="">ALL</option>
    </select>
    <label>Dep</label>
    <input type="text" id="depInput" maxlength="4" style="width:60px;text-transform:uppercase;">
    <label>Arr</label>
    <input type="text" id="arrInput" maxlength="4" style="width:60px;text-transform:uppercase;">
    <label>Sort</label>
    <select id="sortBy">
        <option value="igtd" selected>IGTD</option>
        <option value="etd">ETD</option>
        <option value="callsign">Callsign</option>
        <option value="dep">Departure</option>
        <option value="arr">Arrival</option>
        <option value="status">Status</option>
        <option value="age">Age (newest)</option>
    </select>
</div>

<table class="fido-table">
    <thead>
        <tr>
            <th>CALLSIGN</th>
            <th>STATUS</th>
            <th>TYPE</th>
            <th>DEP</th>
            <th>ARR</th>
            <th title="Initial Gate Time of Departure">IGTD</th>
            <th>ETD</th>
            <th>RWY OFF</th>
            <th>ETA</th>
            <th>ALT</th>
            <th title="Speed (knots)">SPD</th>
            <th>BCN</th>
            <th>STAR</th>
            <th>FAC/CID</th>
            <th>SRC</th>
        </tr>
    </thead>
    <tbody id="rows"></tbody>
</table>

<div id="empty" class="empty">Loading...</div>

<dialog id="detailDialog">
    <div id="detailBody"></div>
    <button id="closeDetail">CLOSE</button>
</dialog>

<script src="/tfm/fido.js?v=1"></script>
</body>
</html>
