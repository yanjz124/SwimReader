<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM FIDO — R14 Flight Data | swim.vncrcc.org</title>
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tfm/fido.css?v=4">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TFM FIDO</h1>
    <span class="sub">R14 Flight Data — every flight in the TFMS feed</span>
    <div class="status-bar">
        <span id="count">--</span>
        <span class="dot">•</span>
        <span id="updated">--</span>
        <span class="dot">•</span>
        <a class="home-link" href="/tfm">tfm</a>
        <span class="dot">•</span>
        <a class="home-link" href="/tfm/aptc">aptc</a>
    </div>
</header>

<div class="filter-row">
    <input type="text" id="searchInput" placeholder="Search (callsign / route / CID / airport / type / facility / fix)..." style="flex:1;min-width:280px;">
    <label>Status</label>
    <select id="statusFilter"><option value="">ALL</option></select>
    <label>Dep</label>
    <input type="text" id="depInput" maxlength="4" style="width:60px;text-transform:uppercase;">
    <label>Arr</label>
    <input type="text" id="arrInput" maxlength="4" style="width:60px;text-transform:uppercase;">
    <label>Sort</label>
    <select id="sortBy">
        <option value="igtd" selected>IGTD</option>
        <option value="etd">ETD</option>
        <option value="callsign">Callsign</option>
        <option value="dep">Dep</option>
        <option value="arr">Arr</option>
        <option value="status">Status</option>
        <option value="age">Age</option>
    </select>
    <label class="cols-label">Columns</label>
    <select id="presetSel">
        <option value="strip" selected>Flight Strip</option>
        <option value="oooi">+OOOI</option>
        <option value="track">Track</option>
        <option value="everything">Everything</option>
    </select>
</div>

<div class="main">
    <div class="table-wrap">
        <table class="fido-table">
            <thead><tr id="thead-row"></tr></thead>
            <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty">Loading...</div>
    </div>
    <div class="detail-panel collapsed" id="detailPanel">
        <div class="detail-header">
            <span class="cs-big" id="detailCallsign"></span>
            <span class="type-badge" id="detailType"></span>
            <span class="status-badge" id="detailStatus"></span>
            <span class="detail-close" id="detailClose">&times;</span>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>
</div>

<script src="/tfm/fido.js?v=4"></script>
<script src="/shared/frame.js?v=3"></script>
</body>
</html>
