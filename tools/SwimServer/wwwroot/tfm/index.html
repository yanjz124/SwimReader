<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFM - Traffic Flow Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📈</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/shared/common.css?v=2">
<link rel="stylesheet" href="/tfm/tfm.css?v=3">
<link rel="stylesheet" href="/shared/frame.css?v=4">
</head>
<body>
<a class="nav-home" href="/">&larr; HOME</a>
<header style="padding-left:100px">
    <h1>TFM</h1>
    <span class="sub">TRAFFIC FLOW MANAGEMENT</span>
    <div class="status-bar">
        <span id="tfmsStatus">TFMS: <b>connecting...</b></span>
        <span id="flightCount">Flights: <b>--</b></span>
    </div>
</header>

<!-- ── Flights view ─────────────────────────────────────────── -->
<div class="main" id="flightView" style="display:flex">
    <div class="list-panel">
        <div class="search-bar">
            <input type="text" id="flightSearch" placeholder="Search callsign, airport, route, STAR...">
        </div>
        <div class="scrollable">
            <table class="flight-table" id="flightTable">
                <thead>
                    <tr>
                        <th>CALLSIGN</th>
                        <th>DEP</th>
                        <th>ARR</th>
                        <th>ALT</th>
                        <th>SPD</th>
                        <th>STAR</th>
                        <th>ETA</th>
                        <th>STATUS</th>
                        <th>CAT</th>
                    </tr>
                </thead>
                <tbody id="flightTableBody"></tbody>
            </table>
        </div>
    </div>
    <div class="detail-panel" id="flightDetail">
        <span class="detail-close" id="flightDetailClose">X</span>
    </div>
</div>

<script src="/idle-timer.js?v=2"></script>
<script src="/tfm/tfm.js?v=2"></script>
<script src="/shared/frame.js?v=4"></script>
<script src="/shared/disclaimer.js?v=2"></script>
</body>
</html>
