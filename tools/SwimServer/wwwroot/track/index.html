<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Track a Flight</title>
<style>
  :root { --yel:#cccc44; --dim:#8a8a3a; --bg:#0a0a0a; --card:#141414; --line:#333; --accent:#4aa3ff; --ok:#44cc44; --warn:#ff8c00; --red:#ff4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--yel);
    font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace; font-size:15px; }
  body { padding-bottom:40px; }
  a { color:var(--accent); }
  .wrap { max-width:640px; margin:0 auto; }

  /* Search header (sticky) */
  header { position:sticky; top:0; z-index:10; background:#000; border-bottom:1px solid var(--line);
    padding:10px 12px; display:flex; gap:8px; align-items:center; }
  header .home { color:var(--dim); text-decoration:none; font-size:13px; padding:6px; }
  header form { flex:1; display:flex; gap:8px; }
  header input { flex:1; min-width:0; background:#1a1a1a; color:var(--yel); border:1px solid var(--line);
    border-radius:8px; padding:11px 12px; font:inherit; text-transform:uppercase; letter-spacing:1px; }
  header input::placeholder { color:#666; text-transform:none; letter-spacing:0; }
  header button { background:#1e2e1e; color:#bfe6bf; border:1px solid #3a5a3a; border-radius:8px;
    padding:0 16px; font:inherit; font-weight:bold; cursor:pointer; }

  .status { padding:8px 14px; color:var(--dim); font-size:12px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#444; }
  .dot.live { background:var(--ok); box-shadow:0 0 6px var(--ok); }

  .msg { padding:40px 20px; text-align:center; color:var(--dim); line-height:1.6; }
  .msg b { color:var(--yel); }

  /* Summary hero */
  .hero { padding:14px; }
  .hero .cs { font-size:30px; font-weight:bold; letter-spacing:2px; color:#fff; }
  .hero .od { font-size:19px; margin-top:2px; }
  .hero .od .arrow { color:var(--dim); }
  .hero .sub { color:var(--dim); font-size:13px; margin-top:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { font-size:11px; letter-spacing:.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--line);
    color:var(--dim); background:#111; }
  .chip.on { color:#000; background:var(--yel); border-color:var(--yel); font-weight:bold; }
  .phase { display:inline-block; margin-top:10px; padding:4px 12px; border-radius:6px; font-weight:bold;
    letter-spacing:1px; font-size:13px; background:#1a2a1a; color:var(--ok); border:1px solid #2f5a2f; }

  /* Cards */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 12px; overflow:hidden; }
  .card > h2 { margin:0; padding:9px 14px; font-size:12px; letter-spacing:2px; color:var(--dim);
    background:#0d0d0d; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .card > h2 .tag { color:var(--yel); font-weight:normal; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; padding:12px 14px; font-size:14px; }
  .grid .k { color:var(--dim); white-space:nowrap; }
  .grid .v { color:var(--yel); word-break:break-word; }
  .grid .v.hl { color:#fff; font-weight:bold; }
  .grid .v.warn { color:var(--warn); }
  .grid .v.red { color:var(--red); }
  .route { padding:0 14px 12px; font-size:13px; color:#dcdcae; word-break:break-word; line-height:1.5; }
  .subhdr { padding:10px 14px 4px; color:var(--dim); font-size:11px; letter-spacing:1px; border-top:1px solid #222; }

  /* Data blocks (mock) */
  .blocks { display:flex; gap:12px; flex-wrap:wrap; padding:12px 14px; }
  .db { flex:1; min-width:150px; }
  .db .lbl { font-size:10px; letter-spacing:2px; color:var(--dim); margin-bottom:6px; }
  .db pre { margin:0; padding:12px 14px; border-radius:8px; font-size:16px; line-height:1.35; white-space:pre;
    font-family:"ERAM",ui-monospace,monospace; }
  .db.eram pre { background:#000; color:var(--yel); border:1px solid #333; }
  .db.eram .sym { color:var(--yel); }
  .db.stars pre { background:#000; color:#39ff62; border:1px solid #1f4a2a; }
  @font-face { font-family:"ERAM"; src:url("/ERAMv110.ttf"); font-display:swap; }

  /* TDLS messages */
  .tmsg { padding:10px 14px; border-top:1px solid #222; font-size:13px; }
  .tmsg .th { color:var(--dim); font-size:11px; margin-bottom:4px; display:flex; justify-content:space-between; }
  .tmsg .body { white-space:pre-wrap; word-break:break-word; color:#dcdcae; line-height:1.45; font-size:12.5px; }
  .tmsg .depline { color:var(--yel); }
  .badge { display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px; background:#222; color:var(--yel); }
  .badge.dep { background:#2a2010; color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="/">&larr;</a>
    <form id="f"><input id="cs" placeholder="Search callsign (e.g. AAL123)" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit">TRACK</button></form>
  </header>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Enter a callsign to follow a flight.</span></div>
  <div id="out"></div>
</div>
<script src="/track/track.js?v=3"></script>
</body>
</html>
